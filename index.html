        {message && <p className="mt-3 text-xs" style={{ color: message.includes("تم") ? "#BBF7D0" : "#FECACA" }}>{message}</p>}
      </form>
    </div>;
  }

  if (!unlocked) return <div className="rounded-2xl border p-6 text-center" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}><img src={LOGO_SRC} alt="DOS Akademie" className="mx-auto mb-4 h-14 w-auto object-contain" /><h1 className="text-2xl font-semibold" style={{ color: COLORS.navy, fontFamily: F_DISPLAY }}>Willkommen in der DOS Bibliothek</h1><p className="mt-2 text-sm" style={{ color: COLORS.subtle }}>أدخل كلمة مرور المكتبة التي أرسلتها الإدارة.</p><form onSubmit={(event) => { event.preventDefault(); if (password === student.libraryAccessPassword) setUnlocked(true); else setMessage("كلمة المرور غير صحيحة."); }} className="mx-auto mt-5 flex max-w-sm gap-2"><input type="password" required className={inputCls} style={inputStyle} value={password} onChange={(event) => setPassword(event.target.value)} placeholder="كلمة المرور" /><button className="rounded-lg px-4 text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>فتح</button></form>{message && <p className="mt-3 text-xs" style={{ color: COLORS.red }}>{message}</p>}</div>;

function AttendanceSummary({ records, studentLevel, editable, onSave, onDelete, saving }) {
  const absenceCount = records.filter((record) => record.status === "absent" && record.level === studentLevel).length;
  const [form, setForm] = useState({ status: "present", sessionDate: new Date().toISOString().slice(0, 10), sessionTime: new Date().toTimeString().slice(0, 5), notes: "" });
  const [editingId, setEditingId] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);

  async function submit(event) {
    event.preventDefault();
    await onSave({ ...form, level: studentLevel, id: editingId });
    setForm((current) => ({ ...current, notes: "" }));
    setEditingId(null);
  }

  function beginEdit(record) {
    setEditingId(record.id);
    setForm({ status: record.status, sessionDate: record.sessionDate, sessionTime: record.sessionTime || "", notes: record.notes || "" });
  }

  return (
    <InfoCard labelAr="الحضور والغياب" labelDe="Anwesenheit">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <span className="text-sm" style={{ color: absenceCount > 2 ? COLORS.red : COLORS.ink }}>غياب المستوى {studentLevel}: {absenceCount} / 2 محاضرة</span>
        <Badge tone={absenceCount > 2 ? "red" : "green"}>{absenceCount > 2 ? "تجاوز الحد" : "ضمن المسموح"}</Badge>
      </div>
      {editable && (
        <form onSubmit={submit} className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
          <select className={inputCls} style={inputStyle} value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
            <option value="present">حضور — Anwesenheit</option><option value="absent">غياب — Abwesend</option><option value="late">تأخير — Verspätet</option>
          </select>
          <input required type="date" className={inputCls} style={inputStyle} value={form.sessionDate} onChange={(e) => setForm({ ...form, sessionDate: e.target.value })} />
          <input required type="time" className={inputCls} style={inputStyle} value={form.sessionTime} onChange={(e) => setForm({ ...form, sessionTime: e.target.value })} />
          <input className={inputCls} style={inputStyle} placeholder="ملاحظة اختيارية" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
          <div className="sm:col-span-2 flex gap-2"><button type="submit" disabled={saving} className="flex-1 px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>{saving ? "جارٍ الحفظ..." : editingId ? "حفظ التعديل" : "تسجيل الحالة"}</button>{editingId && <button type="button" onClick={() => { setEditingId(null); setForm({ status: "present", sessionDate: new Date().toISOString().slice(0, 10), sessionTime: new Date().toTimeString().slice(0, 5), notes: "" }); }} className="px-4 py-2 rounded-lg text-sm" style={{ color: COLORS.subtle }}>إلغاء</button>}</div>
        </form>
      )}
      <div className="space-y-2">
        {records.length === 0 ? <p className="text-sm" style={{ color: COLORS.subtle }}>لا توجد سجلات حضور بعد.</p> : records.map((record) => (
          <div key={record.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-t pt-2" style={{ borderColor: COLORS.border }}>
            <span className="text-sm" style={{ color: COLORS.ink }}>{record.sessionDate} · {record.sessionTime || "—"}{record.notes ? ` · ${record.notes}` : ""}</span>
            <div className="flex items-center gap-2"><Badge tone={attendanceTone(record.status)}>{attendanceLabel(record.status)}</Badge>{editable && <><button type="button" title="تعديل" onClick={() => beginEdit(record)} className="p-1.5 rounded-lg" style={{ color: COLORS.navy }}><Icon.edit /></button><button type="button" title="حذف" onClick={() => { if (window.confirm("هل تريد حذف سجل الحضور؟")) onDelete(record.id); }} className="p-1.5 rounded-lg" style={{ color: COLORS.red }}><Icon.trash /></button></>}</div>
                      <div className="flex items-center gap-2"><Badge tone={attendanceTone(record.status)}>{attendanceLabel(record.status)}</Badge>{editable && <><button type="button" title="تعديل" onClick={() => beginEdit(record)} className="p-1.5 rounded-lg" style={{ color: COLORS.navy }}><Icon.edit /></button><button type="button" title="حذف" onClick={() => setDeleteTarget(record)} className="p-1.5 rounded-lg" style={{ color: COLORS.red }}><Icon.trash /></button></>}</div>
            <p className="text-xs mt-3" style={{ color: absenceCount > 2 ? COLORS.red : COLORS.subtle }}>ØªÙ†Ø¨ÙŠÙ‡: Ù„Ø§ ÙŠÙØ³Ù…Ø Ø¨Ø£ÙƒØ«Ø± Ù…Ù† Ù…ØØ§Ø¶Ø±ØªÙŠÙ† ØºÙŠØ§Ø¨ ÙÙŠ Ø§Ù„Ù…Ø³ØªÙˆÙ‰ Ø§Ù„ÙˆØ§ØØ¯.</p>
            {deleteTarget && <ConfirmDialog title="تأكيد حذف سجل الحضور" message="سيتم حذف هذا السجل من تقرير الطالب نهائياً." onClose={() => setDeleteTarget(null)} onConfirm={() => { onDelete(deleteTarget.id); setDeleteTarget(null); }} />}

            <p className="text-sm" style={{ color: COLORS.subtle, fontFamily: F_AR, direction: "rtl" }}>{student.nameAr}</p>
          </InfoCard>

          <InfoCard labelAr="كود الطالب" labelDe="Student-ID">
            <p className="text-base font-semibold" style={{ color: COLORS.navy, fontFamily: F_MONO }}>{student.id}</p>
          </InfoCard>

          <InfoCard labelAr="الجروب" labelDe="Gruppe">
            <p className="text-sm font-semibold" style={{ color: COLORS.ink }}>{student.groupName || "—"}</p>
          </InfoCard>

          <InfoCard labelAr="كورسات سابقة" labelDe="Frühere Kurse">
            <p className="text-sm" style={{ color: COLORS.ink, whiteSpace: "pre-line" }}>{student.previousCourses || "—"}</p>
          </InfoCard>

          <InfoCard labelAr="إجمالي الرسوم المدفوعة" labelDe="Gesamt bezahlte Gebühren">
            <p className="text-sm font-semibold" style={{ color: COLORS.ink }}>{student.totalFeesPaid.toLocaleString()} {currencyLabel(student.financial.currency)}</p>
          </InfoCard>

          <InfoCard labelAr="الإيميل" labelDe="E-Mail-Adresse">
            <p className="text-sm break-all" style={{ color: COLORS.ink }}>{student.contactEmail || "—"}</p>
          </InfoCard>

          <InfoCard labelAr="المحاضر المسؤول" labelDe="Zuständiger Dozent">
            <p className="text-sm" style={{ color: COLORS.ink }}>{student.instructorName || "غير محدد بعد"}</p>
          </InfoCard>

          <InfoCard labelAr="تاريخ الانضمام للأكاديمية" labelDe="Beitrittsdatum">
            <p className="text-sm" style={{ color: COLORS.ink }}>{student.joinDate}</p>
          </InfoCard>

          <InfoCard labelAr="المستوى الحالي" labelDe="Aktuelles Deutschniveau">
            <Badge tone="gold">{student.level}</Badge>
          </InfoCard>

          <InfoCard labelAr="الخصومات" labelDe="Aktive Rabatte">
            {student.discount > 0 ? (
              <Badge tone="green">
                {student.discountType === "amount" ? `${student.discount} ${currencyLabel(student.financial.currency)} خصم` : `${student.discount}% خصم`}
              </Badge>
            ) : (
              <p className="text-sm" style={{ color: COLORS.subtle }}>لا يوجد خصم حالياً</p>
            )}
          </InfoCard>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
          <div className="lg:col-span-1">
            <InfoCard labelAr="الوضع المالي" labelDe="Zahlungsstatus">
              <div className="space-y-1.5 text-sm" style={{ color: COLORS.ink }}>
                <div className="flex justify-between"><span style={{ color: COLORS.subtle }}>الإجمالي</span><span>{student.financial.total} {currencyLabel(student.financial.currency)}</span></div>
                <div className="flex justify-between"><span style={{ color: COLORS.subtle }}>بعد الخصم</span><span>{discounted} {currencyLabel(student.financial.currency)}</span></div>
                {fin.taxPercent > 0 && (
                  <div className="flex justify-between"><span style={{ color: COLORS.subtle }}>الضريبة ({fin.taxPercent}%)</span><span>+{fin.taxAmount} {currencyLabel(student.financial.currency)}</span></div>
                )}
                <div className="flex justify-between"><span style={{ color: COLORS.subtle }}>الإجمالي النهائي</span><span>{fin.finalTotal} {currencyLabel(student.financial.currency)}</span></div>
                <div className="flex justify-between"><span style={{ color: COLORS.subtle }}>المدفوع</span><span>{student.financial.paid} {currencyLabel(student.financial.currency)}</span></div>
                <div className="flex justify-between pt-1.5 border-t font-semibold" style={{ borderColor: COLORS.border }}>
                  <span>المتبقي</span>
                  <span style={{ color: balance > 0 ? COLORS.red : "#1E7A38" }}>{Math.max(balance, 0)} {currencyLabel(student.financial.currency)}</span>
                </div>
              </div>
            </InfoCard>
          </div>

          <div className="lg:col-span-2">
            <InfoCard labelAr="بيان الدرجات" labelDe="Notenübersicht / Prüfungsergebnisse">
              <div className="space-y-2.5">
                {student.grades.map((g) => (
                  <div key={g.skill}>
                    <div className="flex justify-between text-xs mb-1" style={{ color: COLORS.subtle }}>
                      <span>{g.skill}</span>
                      <span>{g.score}/100</span>
                    </div>
                    <div className="h-1.5 rounded-full" style={{ backgroundColor: "#EDEFF3" }}>
                      <div
                        className="h-1.5 rounded-full"
                        style={{ width: `${g.score}%`, backgroundColor: g.score >= 60 ? COLORS.gold : COLORS.red }}
                      />
                    </div>
                  </div>
                ))}
              </div>
            </InfoCard>
          </div>
        </div>

        <InfoCard labelAr="الشهادات" labelDe="Zertifikate zum Herunterladen (PDF)">
          {student.certificates.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.subtle }}>لا توجد شهادات متاحة بعد — Noch keine Zertifikate verfügbar.</p>
          ) : (
            <div className="flex flex-wrap gap-2.5">
              {student.certificates.map((c, i) => (
                <a
                  key={i}
                  href={c.url}
                  className="flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-semibold border hover:bg-gray-50"
                  style={{ borderColor: COLORS.border, color: COLORS.navy, fontFamily: F_BODY }}
                >
                  <Icon.cert /> {c.title}
                </a>
              ))}
            </div>
          )}
        </InfoCard>

        <div className="mt-4">
          <AttendanceSummary records={attendance} studentLevel={student.level} />
        </div>

        <div className="mt-4">
          <InfoCard labelAr="المستحقات وموعد السداد" labelDe="Offene Beträge und Fälligkeit">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
              <span className="text-sm" style={{ color: COLORS.subtle }}>إجمالي المتبقي — Offener Gesamtbetrag</span>
              <strong style={{ color: balance > 0 ? COLORS.red : "#1E7A38", fontFamily: F_MONO }}>{Math.max(balance, 0).toLocaleString()} {currencyLabel(student.financial.currency)}</strong>
            </div>
            {studentPayments.filter((payment) => payment.status !== "paid").length === 0 ? (
              <p className="text-sm" style={{ color: "#1E7A38" }}>لا توجد مستحقات معلقة — Keine offenen Beträge.</p>
            ) : (
              <div className="space-y-2">
                {studentPayments.filter((payment) => payment.status !== "paid").map((payment) => (
                  <div key={payment.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-t pt-2" style={{ borderColor: COLORS.border }}>
                    <span className="text-sm" style={{ color: COLORS.ink }}>{payment.description}<small className="block" style={{ color: COLORS.subtle }}>موعد السداد: {payment.dueDate || "غير محدد"} — Fälligkeitsdatum</small></span>
                    <strong style={{ color: COLORS.red, fontFamily: F_MONO }}>{Number(payment.amount || 0).toLocaleString()} {currencyLabel(payment.currency)}</strong>
                  </div>
                ))}
              </div>
            )}
          </InfoCard>
        </div>

        <div className="mt-4">
          <InfoCard labelAr="سجل المدفوعات" labelDe="Zahlungsverlauf">
            {studentPayments.length === 0 ? (
              <p className="text-sm" style={{ color: COLORS.subtle }}>لا توجد مدفوعات مسجلة — Keine Zahlungen erfasst.</p>
            ) : (
              <div className="space-y-2">
                {studentPayments.map((payment) => (
                  <div key={payment.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b last:border-b-0 pb-2 last:pb-0" style={{ borderColor: COLORS.border }}>
                    <div><p className="text-sm font-semibold" style={{ color: COLORS.ink }}>{payment.description}</p><p className="text-xs" style={{ color: COLORS.subtle }}>الاستلام: {payment.receivedDate || payment.date} · الاستحقاق: {payment.dueDate || "غير محدد"} · {payment.paymentMethod || "—"}</p></div>
                    <div className="flex items-center gap-2"><Badge tone={payment.status === "paid" ? "green" : "gold"}>{payment.status === "paid" ? "مسدد — Bezahlt" : "معلق — Ausstehend"}</Badge><span className="font-semibold" style={{ color: COLORS.navy, fontFamily: F_MONO }}>{Number(payment.amount || 0).toLocaleString()} {currencyLabel(payment.currency)}</span></div>
                  </div>
                ))}
              </div>
            )}
          </InfoCard>
        </div>
        </>}
      </div>
    </div>
  );
}


/* --------------------------------- Instructor Portal --------------------------------- */

function InstructorPortal({ profile, instructor, students, attendance, libraryBooks, workSessions, onSaveWorkSession, onUpdateWorkSession, refreshMyStudents, refreshInstructor, refreshAttendance, refreshLibrary, requests, onUpdateRequest, onDeleteRequest, onUpdateLibrary, onLogout }) {
  const [dir, setDir] = useState("rtl");
  const [studentQuery, setStudentQuery] = useState("");
  const instructorPageKey = `instructorPortalPage_${profile.id}`;
  const savedPage = loadLS(instructorPageKey, "home");
  const pageFromHash = (window.location.hash || "").replace("#instructor-", "");
  const [instructorPage, setInstructorPage] = useState(INSTRUCTOR_PAGES.some((page) => page.value === pageFromHash) ? pageFromHash : savedPage);
  const pendingRequestCount = (requests || []).filter((request) => (request.status || "pending") === "pending").length;
  const lastPendingRequestRef = useRef(pendingRequestCount);
  const [savingId, setSavingId] = useState(null);
  const [msg, setMsg] = useState("");
  const [attendanceSaving, setAttendanceSaving] = useState(false);
  const [expandedStudentId, setExpandedStudentId] = useState(null);
  const [unreadRequestIds, setUnreadRequestIds] = useState(() => requests.filter((request) => request.status === "pending").map((request) => request.id));
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(() => instructor || {});

  useEffect(() => {
    if (pendingRequestCount > lastPendingRequestRef.current && pendingRequestCount > 0) {
      playBellTone();
    }
    lastPendingRequestRef.current = pendingRequestCount;
  }, [pendingRequestCount]);

  useEffect(() => {
    saveLS(instructorPageKey, instructorPage);
    window.history.replaceState(null, "", `#instructor-${instructorPage}`);
  }, [instructorPage, instructorPageKey]);

  useEffect(() => {
    if (instructor) setForm(instructor);
  }, [instructor]);

  useEffect(() => {
    setUnreadRequestIds((current) => [...new Set([...current, ...requests.filter((request) => request.status === "pending").map((request) => request.id)])]);
  }, [requests]);

  async function handleRequestUpdate(id, changes) {
    setUnreadRequestIds((current) => current.filter((requestId) => requestId !== id));
    await onUpdateRequest(id, changes);
  }

  async function handleRequestDelete(id) {
    setUnreadRequestIds((current) => current.filter((requestId) => requestId !== id));
    await onDeleteRequest(id);
  }

  async function saveProfile(e) {
    e.preventDefault();
    setMsg("");
    try {
      const { error: profileError } = await supabaseClient.from("profiles").update({ full_name: form.name, name_ar: form.nameAr, phone: form.phone }).eq("id", profile.profile_id || profile.id);
      if (profileError) throw new Error(profileError.message);
      const { error: instructorError } = await supabaseClient.from("instructors").update({ subject: form.subject, bio: form.bio, join_date: form.joinDate || null, hours: Number(form.hours) || 0, hourly_rate: Number(form.hourlyRate) || 0, salary_total: (Number(form.hours) || 0) * (Number(form.hourlyRate) || 0), salary_paid: Number(form.salaryPaid) || 0, payment_date: form.paymentDate || null, penalties: Number(form.penalties) || 0, absences: Number(form.absences) || 0 }).eq("profile_id", profile.profile_id || profile.id);
      if (instructorError) throw new Error(instructorError.message);
      await refreshInstructor(profile.profile_id || profile.id);
      setEditing(false);
      setMsg("تم حفظ بيانات الحساب — Kontodaten gespeichert.");
    } catch (e) {
      setMsg(e.message || "تعذّر حفظ بيانات الحساب.");
    }
  }

  async function saveGrades(student, grades) {
    await saveStudentProfile(student, { grades });
  }

  async function saveStudentProfile(student, changes) {
    setSavingId(student.profileId);
    setMsg("");
    try {
      const { error } = await supabaseClient.from("students").update(changes).eq("profile_id", student.profileId);
      if (error) throw new Error(error.message);
      notifyPortalSync("student_data_changed", { profileId: student.profileId, studentId: student.id, instructorId: student.instructorId || profile?.id || null, timestamp: Date.now() });
      await refreshMyStudents();
      setMsg("تم حفظ التعديل بنجاح — Änderung erfolgreich gespeichert.");
    } catch (e) {
      setMsg(e.message || "تعذّر حفظ تعديل بيانات الطالب.");
      throw e;
    } finally {
      setSavingId(null);
    }
  }

  async function saveAttendance(student, record) {
    setAttendanceSaving(true);
    setMsg("");
    try {
      const values = { level: record.level, status: record.status, session_date: record.sessionDate, session_time: record.sessionTime, notes: record.notes.trim() };
      const query = record.id
        ? supabaseClient.from("attendance_records").update(values).eq("id", record.id).eq("instructor_profile_id", profile.id)
        : supabaseClient.from("attendance_records").insert({ ...values, student_profile_id: student.profileId, instructor_profile_id: profile.id });
      const { error } = await query;
      if (error) throw new Error(error.message);
      await refreshAttendance();
      setMsg("تم تسجيل حالة الحضور — Anwesenheit gespeichert.");
    } catch (e) {
      setMsg(e.message || "تعذّر حفظ سجل الحضور.");
    } finally { setAttendanceSaving(false); }
  }

  async function deleteAttendance(id) {
    setAttendanceSaving(true);
    try {
      const { error } = await supabaseClient.from("attendance_records").delete().eq("id", id).eq("instructor_profile_id", profile.id);
      if (error) throw new Error(error.message);
      await refreshAttendance();
      setMsg("تم حذف سجل الحضور.");
    } catch (e) {
      setMsg(e.message || "تعذّر حذف سجل الحضور.");
    } finally { setAttendanceSaving(false); }
  }

  async function addLibraryBook(book) {
    let url = book.url.trim();
    let uploadedPath = "";
    if (book.file) {
      if (book.file.size > 25 * 1024 * 1024) throw new Error("حجم الملف يجب ألا يتجاوز 25 ميجابايت.");
      const safeName = book.file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      uploadedPath = `${profile.id}/${Date.now()}-${safeName}`;
      const fileExtension = book.file.name.toLowerCase().split(".").pop();
      const contentType = fileExtension === "html" || fileExtension === "htm" ? "text/html" : (book.file.type || "application/octet-stream");
      const { error: uploadError } = await supabaseClient.storage.from("course-library").upload(uploadedPath, book.file, { upsert: false, contentType, cacheControl: "3600" });
      if (uploadError) throw new Error(`تعذر رفع الملف: ${uploadError.message}`);
      url = "";
    }
    if (!url && book.libraryType === "paper") url = `paper://${encodeURIComponent(book.title.trim())}`;
    const { error } = await supabaseClient.from("course_library").insert({ level: book.level, library_type: book.libraryType, category: book.category, title: book.title.trim(), url, storage_path: uploadedPath || null, visible: true, instructor_profile_id: profile.id });
    if (error) {
      if (uploadedPath) await supabaseClient.storage.from("course-library").remove([uploadedPath]);
      throw new Error(`تم رفع الملف لكن تعذر حفظه في المكتبة: ${error.message}`);
    }
    await refreshLibrary();
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: COLORS.bg }} dir={dir}>
      <div className="sticky top-0 z-30 flex items-center justify-between px-5 md:px-8 py-3.5 border-b" style={{ backgroundColor: COLORS.navyDeep, borderColor: COLORS.navyMid }}>
        <div className="flex items-center gap-3">
          <LogoMark height={28} />
          <span className="hidden sm:inline text-sm font-semibold pl-3 ml-1 border-l" style={{ color: "#C6D0DE", borderColor: "#2A3C58", fontFamily: F_BODY }}>
            بوابة المحاضر — Dozentenportal
          </span>
        </div>
        <div className="flex items-center gap-2">
          <NotificationBell
            count={pendingRequestCount}
            onClick={() => {
              setUnreadRequestIds([]);
              setInstructorPage("requests");
            }}
            color="#E7ECF3"
          />
          <select className="rounded-lg border px-3 py-1.5 text-xs font-semibold" style={{ backgroundColor: COLORS.navyDeep, color: "#E7ECF3", borderColor: "#52627A", fontFamily: F_BODY }} value="" onChange={(e) => { const next = e.target.value; if (next === "logout") onLogout(); else if (next === "language") setDir((current) => current === "rtl" ? "ltr" : "rtl"); else if (next) setInstructorPage(next); }}>
            <option value="" disabled>القائمة — Menü</option>
            {INSTRUCTOR_PAGES.map((page) => <option key={page.value} value={page.value}>{page.label}</option>)}
            <option value="language">تغيير اللغة — Sprache wechseln</option>
          </select>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-5 md:px-8 py-8">
        {instructorPage !== "home" && <button type="button" onClick={() => setInstructorPage("home")} className="flex items-center gap-1.5 text-sm font-semibold mb-5" style={{ color: COLORS.navy }}><Icon.back /> العودة للرئيسية — Zurück</button>}
        {instructorPage === "requests" && <RequestsPage requests={requests} onUpdate={handleRequestUpdate} onDelete={handleRequestDelete} onBack={() => { setUnreadRequestIds([]); setInstructorPage("home"); }} />}
        {instructorPage === "work-hours" && <EmployeeWorkPage profile={profile} employees={[]} sessions={workSessions || []} onSaveSession={onSaveWorkSession} onUpdateSession={onUpdateWorkSession} />}
        {instructorPage === "library" && <LibraryPage books={libraryBooks} initialLevel={students[0]?.level} editable onAdd={addLibraryBook} onUpdate={onUpdateLibrary} onDelete={async (id) => { await supabaseClient.from("course_library").delete().eq("id", id); await refreshLibrary(); }} />}
        {instructorPage === "dictionaries" && <LibraryPage books={libraryBooks} initialLevel={students[0]?.level} editable dictionariesOnly onAdd={async (book) => { await supabaseClient.from("course_library").insert({ level: book.level, category: "dictionary", title: book.title.trim(), url: book.url.trim(), visible: true, instructor_profile_id: profile.id }); await refreshLibrary(); }} onUpdate={onUpdateLibrary} onDelete={async (id) => { await supabaseClient.from("course_library").delete().eq("id", id); await refreshLibrary(); }} />}
        {instructorPage === "other" && <InfoCard labelAr="أخرى" labelDe="Weitere"><p className="text-sm" style={{ color: COLORS.ink }}>يمكن استخدام هذه الصفحة لإضافة ملاحظات أو أدوات خاصة بالأكاديمية.</p></InfoCard>}
        {instructorPage === "home" && <InstructorHomePage instructor={instructor} students={students} attendance={attendance} />}
        {instructorPage === "students" && <>
        <div className="mb-7">
          <h1 className="text-2xl md:text-3xl font-semibold" style={{ color: COLORS.ink, fontFamily: F_DISPLAY }}>
            Willkommen, {profile.full_name}!
          </h1>
          <p className="text-sm mt-1" style={{ color: COLORS.subtle, fontFamily: F_AR, direction: "rtl" }}>
            طلابك المسندون إليك ({students.length})
          </p>
          <input className={`${inputCls} mt-3 max-w-xl`} style={inputStyle} value={studentQuery} onChange={(e) => setStudentQuery(e.target.value)} placeholder="ابحث بكود الطالب أو اسمه أو البريد الإلكتروني" />
          <button type="button" onClick={() => downloadAttendanceReport(students, attendance)} className="mt-3 px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>تنزيل تقرير حضور كل الطلاب</button>
        </div>

        {msg && (
          <p className="text-sm rounded-lg px-3 py-2 mb-4" style={{ backgroundColor: "#EAF0F8", color: COLORS.navy, fontFamily: F_BODY }}>
            {msg}
          </p>
        )}

        {instructor && (
          <div className="rounded-2xl border p-5 mb-4" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="text-base font-semibold" style={{ color: COLORS.ink, fontFamily: F_DISPLAY }}>بيانات حسابي — Meine Kontodaten</h2>
                <p className="text-xs" style={{ color: COLORS.subtle, fontFamily: F_BODY }}>{instructor.id}</p>
              </div>
              <span className="text-xs" style={{ color: COLORS.subtle }}>التعديل من لوحة الأدمن فقط</span>
            </div>
            {editing ? (
              <form onSubmit={saveProfile} className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {[['name', 'الاسم بالكامل'], ['nameAr', 'الاسم بالعربية'], ['phone', 'رقم الهاتف'], ['subject', 'التخصص / المادة'], ['joinDate', 'تاريخ الانضمام'], ['paymentDate', 'تاريخ القبض'], ['hours', 'عدد الساعات'], ['hourlyRate', 'سعر الساعة'], ['salaryPaid', 'المرتب المقبوض'], ['penalties', 'الجزاءات'], ['absences', 'أيام الغياب']].map(([key, label]) => (
                  <Field key={key} label={label}>
                    <input type={key.includes('Date') ? 'date' : ['hours', 'hourlyRate', 'salaryPaid', 'penalties', 'absences'].includes(key) ? 'number' : 'text'} min="0" className={inputCls} style={inputStyle} value={form[key] || ""} onChange={(e) => setForm({ ...form, [key]: e.target.value })} />
                  </Field>
                ))}
                <Field label="إجمالي المرتب المحسوب"><input readOnly className={inputCls} style={{ ...inputStyle, backgroundColor: "#F1F4F7" }} value={(Number(form.hours) || 0) * (Number(form.hourlyRate) || 0)} /></Field>
                <div className="sm:col-span-2 flex gap-2 justify-end"><button type="button" onClick={() => { setForm(instructor); setEditing(false); }} className="px-4 py-2 rounded-lg text-sm" style={{ color: COLORS.subtle }}>إلغاء</button><button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>حفظ التعديلات</button></div>
              </form>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm" style={{ color: COLORS.ink }}>
                <div>الاسم: {instructor.name || "—"}</div><div>المادة: {instructor.subject || "—"}</div><div>الهاتف: {instructor.phone || "—"}</div><div>الانضمام: {instructor.joinDate || "—"}</div>
                <div>الساعات: {instructor.hours || 0}</div><div>سعر الساعة: {instructor.hourlyRate || 0}</div><div>إجمالي المرتب: {instructor.salaryTotal || 0}</div><div>المقبوض: {instructor.salaryPaid || 0}</div>

              {expandedStudentId === s.profileId && <AttendanceSummary records={attendance.filter((record) => record.studentProfileId === s.profileId)} studentLevel={s.level} editable onSave={(record) => saveAttendance(s, record)} onDelete={deleteAttendance} saving={attendanceSaving} />}
            </div>
          ))}
          {students.length === 0 && (
            <div className="rounded-2xl border p-8 text-center" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}>
              <p className="text-sm" style={{ color: COLORS.subtle, fontFamily: F_BODY }}>
                لا يوجد طلاب مسندون إليك بعد — Noch keine Studierenden zugewiesen.
              </p>
            </div>
          )}
        </div>
        </>}
      </div>
    </div>
  );
}

function InstructorStudentCard({ student, saving, onSaveGrades, onSaveStudentData, onDownloadReport }) {
  const [grades, setGrades] = useState(student.grades);
  const [certificates, setCertificates] = useState(student.certificates || []);
  const [certificateMessage, setCertificateMessage] = useState("");

  function setScore(i, value) {
    setGrades((g) => g.map((row, idx) => (idx === i ? { ...row, score: Math.max(0, Math.min(100, Number(value) || 0)) } : row)));
  }

  function addCertificate() { setCertificates((current) => [...current, { title: "", url: "" }]); }
  function updateCertificate(index, key, value) { setCertificates((current) => current.map((item, i) => i === index ? { ...item, [key]: value } : item)); }
  async function saveCertificates() {
    const valid = certificates.filter((item) => item.title.trim() && item.url.trim());
    if (valid.length !== certificates.length) { setCertificateMessage("يرجى إدخال اسم ورابط صحيح لكل شهادة."); return; }
    try {
      await onSaveStudentData(student, { certificates: valid });
      setCertificateMessage("تم حفظ الشهادات بنجاح.");
    } catch (error) {
      setCertificateMessage(error.message || "تعذّر حفظ الشهادات.");
    }
  }

  return (
    <div className="rounded-2xl border p-5" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}>
      <div className="flex items-center justify-between mb-3">
        <div>
          <p className="text-sm font-semibold" style={{ color: COLORS.ink, fontFamily: F_BODY }}>{student.name}</p>
          <p className="text-xs" style={{ color: COLORS.subtle, fontFamily: F_MONO }}>{student.id} · {student.level} · {student.groupName || "—"}</p>
          <p className="text-xs" style={{ color: COLORS.subtle }}>الكورسات السابقة: {student.previousCourses || "—"}</p>
        </div>
        <Badge tone={student.status === "active" ? "green" : "gold"}>{student.status === "active" ? "نشط" : "متوقف"}</Badge>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        {grades.map((g, i) => (
          <div key={g.skill} className="flex items-center gap-2">
            <span className="text-xs w-20 shrink-0" style={{ color: COLORS.subtle }}>{g.skill}</span>
            <input
              type="number" min="0" max="100"
              className={inputCls} style={inputStyle}
              value={g.score}
              onChange={(e) => setScore(i, e.target.value)}
            />
          </div>
        ))}
      </div>
      <button
        onClick={() => onSaveGrades(student, grades)}
        disabled={saving}
        className="px-4 py-2 rounded-lg text-xs font-semibold hover:opacity-90 disabled:opacity-60"
        style={{ backgroundColor: COLORS.navy, color: "#fff", fontFamily: F_BODY }}
      >
        {saving ? "جارٍ الحفظ..." : "حفظ الدرجات — Noten speichern"}
      </button>
      <button type="button" onClick={onDownloadReport} className="mr-2 px-4 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: COLORS.gold, color: COLORS.navy }}>تنزيل تقرير هذا الطالب</button>
      <div className="mt-4 border-t pt-3" style={{ borderColor: COLORS.border }}>
        <div className="flex items-center justify-between"><span className="text-xs font-semibold" style={{ color: COLORS.ink }}>شهادات الطالب</span><button type="button" onClick={addCertificate} className="text-xs font-semibold" style={{ color: COLORS.navy }}>+ إضافة شهادة</button></div>
        {certificates.map((certificate, index) => <div key={index} className="flex gap-2 mt-2"><input className={inputCls} style={inputStyle} placeholder="اسم الشهادة" value={certificate.title} onChange={(e) => updateCertificate(index, "title", e.target.value)} /><input className={inputCls} style={inputStyle} placeholder="رابط الشهادة" value={certificate.url} onChange={(e) => updateCertificate(index, "url", e.target.value)} /></div>)}
        {certificates.length > 0 && <button type="button" onClick={saveCertificates} disabled={saving} className="mt-2 px-3 py-2 rounded-lg text-xs font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>حفظ الشهادات</button>}
        {certificateMessage && <p className="text-xs mt-2" style={{ color: certificateMessage.includes("بنجاح") ? "#1E7A38" : COLORS.red }}>{certificateMessage}</p>}
      </div>
    </div>
  );
}

  async function refreshRequests(role, profileId) {

    if (role === "instructor") query = query.eq("instructor_profile_id", profileId);

    const { data: profiles } = await supabaseClient.from("profiles").select("id, username, full_name, name_ar").in("id", ids);

    setRequests(data.map((request) => ({ ...request, student_name: names[request.student_profile_id]?.full_name || names[request.student_profile_id]?.name_ar || "", student_code: names[request.student_profile_id]?.username || "" })));

  async function submitStudentRequest(form) {
    const instructorProfileId = myRecord?.instructorId || null;
    const referenceCode = `REF_${myRecord.id}_${Date.now().toString().slice(-6)}`;
    const { error } = await supabaseClient.from("student_requests").insert({ student_profile_id: myRecord.profileId, instructor_profile_id: instructorProfileId, request_type: form.requestType, details: form.details.trim(), reference_code: referenceCode, payment_status: "pending", transfer_info: form.transferInfo || "", receipt: form.receipt || "", payment_method: form.paymentMethod || "", payment_amount: Number(form.paymentAmount) || 0 });
    if (error) {
      if (error.message && error.message.includes("payment_amount")) return "قاعدة البيانات تحتاج تحديث أعمدة الدفع. شغّل ملف supabase_requests_payment_fix.sql في Supabase SQL Editor ثم حاول مرة أخرى.";
      return error.message;
    }
    notifyPortalSync("requests_changed", { profileId: myRecord.profileId, instructorId: instructorProfileId, requestType: form.requestType, timestamp: Date.now() });
    await refreshRequests("student", myRecord.profileId);
    return "تم إرسال الطلب بنجاح.";
  }

  async function updateStudentRequest(id, changes) {
    const targetRequest = requests.find((item) => item.id === id) || null;
    if (targetRequest?.request_type === "library_payment" && changes.status && profile?.role !== "admin") return;
    if (targetRequest?.request_type === "library_payment" && changes.status === "approved" && profile?.role === "admin" && !window.confirm("تأكيد فتح المكتبة لهذا الطالب؟ سيتم تفعيل وصوله إلى المواد التعليمية.")) return;
    if (profile?.role === "accountant" && Object.keys(changes).some((key) => key !== "admin_note")) return;
    const { libraryAccessPassword, ...requestChanges } = changes;
    const { error } = await supabaseClient.from("student_requests").update({ ...requestChanges, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) return;

    if (targetRequest?.request_type === "library_payment" && changes.status === "approved") {
      const { error: accessError } = await supabaseClient.from("students").update({ library_access_enabled: true, library_access_password: libraryAccessPassword || "" }).eq("profile_id", targetRequest.student_profile_id);
      if (accessError) throw new Error(`تعذر فتح المكتبة: ${accessError.message}`);
      notifyPortalSync("student_data_changed", { profileId: targetRequest.student_profile_id, timestamp: Date.now() });
    }
    if (targetRequest?.request_type === "library_payment" && changes.status === "rejected") {
      const { error: accessError } = await supabaseClient.from("students").update({ library_access_enabled: false }).eq("profile_id", targetRequest.student_profile_id);
      if (accessError) throw new Error(`تعذر إغلاق المكتبة: ${accessError.message}`);
      notifyPortalSync("student_data_changed", { profileId: targetRequest.student_profile_id, timestamp: Date.now() });
    }

    const requestSource = targetRequest || (await supabaseClient.from("student_requests").select("*").eq("id", id).maybeSingle()).data;
    const shouldAddIncoming = requestSource && requestSource.request_type === "payment" && (
      changes.payment_status === "paid" ||
      changes.status === "approved" ||
      changes.status === "paid"
    );

    if (shouldAddIncoming) {
      const amount = Number(requestSource.payment_amount || changes.payment_amount || 0);
      if (amount > 0) {
        const entry = {
          id: `request-payment-${id}`,
          source: "student-request-payment",
          description: requestSource.details || "طلب دفع طالب — Student payment request",
          amount,
          currency: requestSource.currency || "EGP",
          date: new Date().toISOString().slice(0, 10),
          studentId: requestSource.student_profile_id || requestSource.student_code || "",
          studentName: requestSource.student_name || "طالب",
          receivedDate: new Date().toISOString().slice(0, 10),
          dueDate: "",
          status: "paid",
          paymentMethod: requestSource.payment_method || "cash",
          receipt: requestSource.receipt || "",
        };
        setIncomingFunds((items) => [entry, ...items.filter((item) => item.id !== entry.id)]);
      }
    }

    notifyPortalSync("requests_changed", { profileId: requestSource?.student_profile_id || profile?.id, instructorId: profile?.id, requestId: id, timestamp: Date.now() });
    await refreshRequests(profile?.role, profile?.id);
  }

  async function deleteStudentRequest(id) {
    if (!profile) return;
    let query = supabaseClient.from("student_requests").delete().eq("id", id);
    if (profile.role === "student") query = query.eq("student_profile_id", profile.id);
    else if (!["admin", "instructor"].includes(profile.role)) return;
    const { error } = await query;
    if (!error) {
      notifyPortalSync("requests_changed", { profileId: profile.id, requestId: id, timestamp: Date.now() });
      await refreshRequests(profile.role, profile.id);
    }
  }

  useEffect(() => {
    if (!profile) return undefined;
    const channel = supabaseClient.channel(`student-requests-${profile.id}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "student_requests" }, (payload) => {
        const row = payload.new || payload.old || {};
        const isRelevant = profile.role === "admin" || row.student_profile_id === profile.id || row.instructor_profile_id === profile.id;
        if (!isRelevant) return;
        refreshRequests(profile.role, profile.id);
        if (profile.role === "instructor" && payload.eventType === "INSERT" && typeof window.Notification !== "undefined") {
          if (window.Notification.permission === "granted") new window.Notification("طلب طالب جديد", { body: "تم تقديم طلب جديد ويحتاج إلى المراجعة." });
          else if (window.Notification.permission === "default") window.Notification.requestPermission();
        }
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [profile]);

  useEffect(() => {
    if (!profile) return undefined;

    const studentChannel = supabaseClient.channel(`student-data-${profile.id}`);
    const profileChannel = supabaseClient.channel(`profile-data-${profile.id}`);
    const workChannel = supabaseClient.channel(`employee-work-${profile.id}`);
    const syncCleanup = subscribePortalSync((message) => {
      const payload = message && message.payload ? message.payload : {};
      if (!payload) return;

      const role = profile.role;
      if (["admin", "accountant", "staff"].includes(role)) {
        if (message.eventName === "student_data_changed" || message.eventName === "student_profile_changed" || message.eventName === "requests_changed") {
          refreshStudents();
          refreshLog();
          refreshAdmins();
          if (payload.profileId) refreshRequests(role, profile.id);
        }
      }

      if (role === "student" && payload.profileId === profile.id) {
        refreshMyRecord(profile.id);
        refreshRequests("student", profile.id);
      }

      if (role === "instructor") {
        if (payload.instructorId === profile.id || payload.profileId === profile.id) {
          refreshMyStudents(profile.id);
          refreshAttendance({ instructorProfileId: profile.id });
          refreshRequests("instructor", profile.id);
        }
      }
    });

    studentChannel
      .on("postgres_changes", { event: "*", schema: "public", table: "students" }, (payload) => {
        const row = payload.new || payload.old || {};
        if (profile.role === "student" && row.profile_id === profile.id) refreshMyRecord(profile.id);
        if (profile.role === "instructor" && (row.instructor_id === profile.id || row.profile_id === profile.id)) {
          refreshMyStudents(profile.id);
          refreshAttendance({ instructorProfileId: profile.id });
        }
        if (profile.role === "admin") refreshStudents();
      })
      .subscribe();

    profileChannel
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, (payload) => {
        const row = payload.new || payload.old || {};
        if (profile.role === "student" && row.id === profile.id) refreshMyRecord(profile.id);
        if (profile.role === "instructor" && row.id === profile.id) refreshMyInstructor(profile.id);
        if (profile.role === "admin") {
          refreshStudents();
          refreshInstructors();
        }
      })
      .subscribe();

    workChannel
      .on("postgres_changes", { event: "*", schema: "public", table: "employee_work_sessions" }, (payload) => {
        const row = payload.new || payload.old || {};
        if (profile.role === "admin" || row.employee_profile_id === profile.id) refreshWorkSessions();
      })
      .subscribe();

    return () => {
      syncCleanup();
      supabaseClient.removeChannel(studentChannel);
      supabaseClient.removeChannel(profileChannel);
      supabaseClient.removeChannel(workChannel);
    };
  }, [profile]);

  async function addLog(action, details) {
    if (!profile) return;
    await supabaseClient.from("activity_log").insert({ actor_username: profile.username, action, details });
  }

  async function loadProfileAndData(userId) {
    const { data: p, error } = await supabaseClient.from("profiles").select("*").eq("id", userId).single();
    if (error || !p) {
      setProfile(null);
      setLoading(false);
      return;
    }
    setProfile(p);
    const savedHash = window.location.hash || "";
    const adminPages = ["dashboard", "requests", "financial", "invoice", "accounts", "work-hours", "instructors", "log", "student", "students", "add-student"];
    const keepHash = ["admin", "accountant", "staff"].includes(p.role)
      ? adminPages.includes(savedHash.replace("#", ""))
        ? savedHash
        : "#dashboard"
      : p.role === "instructor"
        ? savedHash.startsWith("#instructor-") ? savedHash : "#instructor-home"
        : savedHash.startsWith("#student-") ? savedHash : "#student-home";
    window.history.replaceState(null, "", keepHash);
    if (["admin", "accountant", "staff"].includes(p.role)) {
      await Promise.all([refreshStudents(), refreshInstructors(), refreshAdmins(), refreshLog(), refreshWorkSessions(), refreshLibrary(), refreshRequests("admin", p.id)]);
    } else if (p.role === "instructor") {
      await Promise.all([refreshMyStudents(p.id), refreshMyInstructor(p.id), refreshAttendance({ instructorProfileId: p.id }), refreshWorkSessions(), refreshLibrary(), refreshRequests("instructor", p.id)]);
    } else if (p.role === "student") {
      await Promise.all([refreshMyRecord(p.id), refreshAttendance({ studentProfileId: p.id }), refreshLibrary(), refreshRequests("student", p.id)]);
    }
    setLoading(false);
  }

  useEffect(() => {
    if (configError) { setLoading(false); return; }

    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      if (data.session) loadProfileAndData(data.session.user.id);
      else setLoading(false);
    });

    const { data: sub } = supabaseClient.auth.onAuthStateChange((event, newSession) => {
      setSession(newSession);
      if (newSession) {
        setLoading(true);
        loadProfileAndData(newSession.user.id);
      } else {
        setProfile(null);
        setStudents([]);
        setInstructors([]);
        setAdminAccounts([]);
        setActivityLog([]);
        setWorkSessions([]);
        setMyStudents([]);
        setMyInstructor(null);
        setAttendance([]);
        setLibraryBooks([]);
        setMyRecord(null);
        setRequests([]);
        setLoading(false);
      }
    });

    return () => sub.subscription.unsubscribe();
  }, [configError]);

  useEffect(() => {
    if (!profile || !window.speechSynthesis) return undefined;
    const utterance = new SpeechSynthesisUtterance(`Willkommen ${profile.full_name || profile.username}. Schoen, dass Sie wieder da sind.`);
    utterance.lang = "de-DE";
    utterance.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
    return () => window.speechSynthesis.cancel();
  }, [profile?.id]);

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.hash = "";
  }

  function requestLogout() {
    setShowLogoutConfirm(true);
  }

  if (configError) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ backgroundColor: COLORS.bg }}>
        <div className="max-w-lg w-full rounded-2xl border p-6 text-center" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}>
          <LogoMark height={32} />
          <p className="text-sm mt-5" style={{ color: COLORS.red, fontFamily: F_BODY }}>{configError}</p>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div
        className="min-h-screen flex items-center justify-center px-6"
        style={{
          background: "radial-gradient(circle at top, rgba(227,168,37,0.16), rgba(11,31,58,0.06) 35%, #F3F5F8 70%)",
          fontFamily: F_BODY,
        }}
      >
        <div
          className="relative flex flex-col items-center justify-center w-full max-w-md rounded-[28px] border p-8 text-center shadow-[0_22px_60px_rgba(11,31,58,0.12)]"
          style={{
            backgroundColor: "rgba(255,255,255,0.7)",
            borderColor: "rgba(19,42,76,0.08)",
            backdropFilter: "blur(14px)",
          }}
        >
          <div className="absolute inset-0 rounded-[28px]" style={{ background: "linear-gradient(135deg, rgba(227,168,37,0.08), rgba(11,31,58,0.02))" }} />
          <div className="relative z-10 flex flex-col items-center">
            <div className="mb-5 flex items-center justify-center rounded-2xl border p-4 shadow-sm" style={{ backgroundColor: "#fff", borderColor: "rgba(11,31,58,0.08)" }}>
              <img src={LOADING_IMAGE_SRC} alt="DOS loading" style={{ height: 62, width: "auto", objectFit: "contain" }} />
            </div>

            <div className="mb-3 flex items-center gap-2">
              <span className="inline-block h-2.5 w-2.5 rounded-full animate-pulse" style={{ backgroundColor: COLORS.gold, boxShadow: "0 0 0 6px rgba(227,168,37,0.12)" }} />
              <span className="inline-block h-2.5 w-2.5 rounded-full animate-pulse [animation-delay:150ms]" style={{ backgroundColor: COLORS.navy, boxShadow: "0 0 0 6px rgba(11,31,58,0.08)" }} />
              <span className="inline-block h-2.5 w-2.5 rounded-full animate-pulse [animation-delay:300ms]" style={{ backgroundColor: COLORS.gold, boxShadow: "0 0 0 6px rgba(227,168,37,0.12)" }} />
            </div>

            <p className="text-sm font-semibold tracking-[0.18em] uppercase" style={{ color: COLORS.navy, letterSpacing: "0.18em" }}>
              Loading
            </p>
            <p className="mt-2 text-xs" style={{ color: COLORS.subtle }}>
              جاري تجهيز لوحة التحكم...
            </p>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: F_BODY }}>
      {(!session || !profile) && <LoginPage />}

      {session && profile && ["admin", "accountant", "staff"].includes(profile.role) && (
        <AdminDashboard
          students={students}
          instructors={instructors}
          adminAccounts={adminAccounts}
          activityLog={activityLog}
          profile={profile}
          requests={requests}
          refreshStudents={refreshStudents}
          refreshInstructors={refreshInstructors}
          refreshAdmins={refreshAdmins}
          refreshLog={refreshLog}
          addLog={addLog}
          onUpdateRequest={updateStudentRequest}
          onDeleteRequest={deleteStudentRequest}
          onLogout={requestLogout}
          workSessions={workSessions}
          onSaveWorkSession={saveWorkSession}
          onUpdateWorkSession={updateWorkSession}
          libraryBooks={libraryBooks}
          refreshLibrary={refreshLibrary}
          onUpdateLibraryBook={updateLibraryBook}
          onUpdateAccount={updateAccount}
        />
      )}

      {session && profile && profile.role === "instructor" && (
        <InstructorPortal
          profile={profile}
          instructor={myInstructor}
          students={myStudents}
          attendance={attendance}
          libraryBooks={libraryBooks}
          workSessions={workSessions}
          onSaveWorkSession={saveWorkSession}
          onUpdateWorkSession={updateWorkSession}
          refreshLibrary={refreshLibrary}
          onUpdateLibrary={updateLibraryBook}
          requests={requests.filter((request) => request.request_type !== "payment")}
          refreshMyStudents={() => refreshMyStudents(profile.id)}
          refreshInstructor={refreshMyInstructor}
          refreshAttendance={() => refreshAttendance({ instructorProfileId: profile.id })}
          onUpdateRequest={updateStudentRequest}
          onDeleteRequest={deleteStudentRequest}
          onLogout={requestLogout}
        />
      )}

      {session && profile && profile.role === "student" && myRecord && (
        <StudentPortal student={myRecord} attendance={attendance} libraryBooks={libraryBooks} requests={requests} onSubmitRequest={submitStudentRequest} onDeleteRequest={deleteStudentRequest} onLogout={requestLogout} />
      )}
      {showLogoutConfirm && <ConfirmActionModal title="تأكيد تسجيل الخروج" message="هل تريد تسجيل الخروج من النظام الآن؟" confirmLabel="تسجيل الخروج" onConfirm={() => { setShowLogoutConfirm(false); handleLogout(); }} onClose={() => setShowLogoutConfirm(false)} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
