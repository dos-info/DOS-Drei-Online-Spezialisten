function mapStudySessionRow(row) {
  return { id: row.id, studentProfileId: row.student_profile_id, startedAt: row.started_at, endedAt: row.ended_at, breakMinutes: Number(row.break_minutes) || 0, breakStartedAt: row.break_started_at, breakEndedAt: row.break_ended_at, status: row.status || "finished" };
}

function calculateStudyStats(session, timestamp = Date.now()) {
  if (!session) return { studyMinutes: 0, breakMinutes: 0 };
  const start = new Date(session.startedAt).getTime();
  const end = session.endedAt ? new Date(session.endedAt).getTime() : timestamp;
  let breakMs = Number(session.breakMinutes || 0) * 60000;
  if (session.breakStartedAt) {
    const breakStart = new Date(session.breakStartedAt).getTime();
    if (session.status === "break" && !session.breakEndedAt) {
      breakMs = Math.max(0, Math.min(timestamp, breakStart + 20 * 60000) - breakStart);
    } else {
      const breakEnd = session.breakEndedAt ? new Date(session.breakEndedAt).getTime() : breakStart + breakMs;
      breakMs = Math.max(breakMs, Math.max(0, breakEnd - breakStart));
    }
  }
  return {
    studyMinutes: Math.max(0, Math.floor((end - start - breakMs) / 60000)),
    breakMinutes: Math.max(0, Math.floor(breakMs / 60000)),
  };
}

  permissions = Array.isArray(permissions) ? permissions : (DEFAULT_EMPLOYEE_PERMISSIONS[profile?.role] || []);
  return permissions.includes(permission);
}

function notifyPortalSync(eventName, payload) {
  try {
    const message = {
      source: "dos-academy-sync",
      eventName,
      payload,
      timestamp: Date.now(),
    };

    if (typeof BroadcastChannel !== "undefined") {
      const channel = new BroadcastChannel("dos-academy-sync");
      channel.postMessage(message);
      channel.close();
    }

    window.localStorage.setItem(LS_PREFIX + "portal_sync_event", JSON.stringify(message));
  } catch (e) {}
}

function subscribePortalSync(handler) {
  const onStorage = (event) => {
    const key = event.key || "";
    if (key !== LS_PREFIX + "portal_sync_event") return;
    if (!event.newValue) return;
    try {
      const message = JSON.parse(event.newValue);
      if (message && message.source === "dos-academy-sync") handler(message);
    } catch (e) {}
  };

  let channel = null;
  if (typeof BroadcastChannel !== "undefined") {
    channel = new BroadcastChannel("dos-academy-sync");
    channel.onmessage = (event) => {
      const message = event && event.data ? event.data : null;
      if (message && message.source === "dos-academy-sync") handler(message);
    };
  }

  window.addEventListener("storage", onStorage);
  return () => {
    window.removeEventListener("storage", onStorage);
    if (channel) channel.close();
  };
}

function clearLS() {
  try {
    Object.keys(window.localStorage)
      .filter((k) => k.startsWith(LS_PREFIX))
      .forEach((k) => window.localStorage.removeItem(k));
  } catch (e) {}
}

/* حساب الرسوم النهائية: خصم (نسبة % أو مبلغ ثابت) ثم ضريبة على الصافي */
function computeStudentFinance(student) {
  const total = (student.financial && student.financial.total) || 0;
  const paid = (student.financial && student.financial.paid) || 0;
  const discountValue = student.discount || 0;
  const discountType = student.discountType || "percent";
  const taxPercent = student.taxPercent || 0;

  const discountAmount =
    discountType === "amount"
      ? Math.min(discountValue, total)
      : Math.round(total * (discountValue / 100));
  const afterDiscount = Math.max(total - discountAmount, 0);
  const taxAmount = Math.round(afterDiscount * (taxPercent / 100));
  const finalTotal = afterDiscount + taxAmount;
  const balance = finalTotal - paid;

  return { total, paid, discountValue, discountType, taxPercent, discountAmount, afterDiscount, taxAmount, finalTotal, balance };
}

function playBellTone() {
  try {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return;
    const audioCtx = new AudioCtor();
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.type = "triangle";
    oscillator.frequency.value = 880;
    gain.gain.value = 0.16;
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.35);
    setTimeout(() => audioCtx.close(), 420);
  } catch (e) {}
}

function LoginPage({ onBack }) {
  const [identifier, setIdentifier] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const [failedAttempts, setFailedAttempts] = useState(0);
  const [lockedUntil, setLockedUntil] = useState(0);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (lockedUntil > Date.now()) {
      setError(`Zu viele fehlgeschlagene Versuche. Bitte warten Sie ${Math.ceil((lockedUntil - Date.now()) / 1000)} Sekunden.`);
      return;
    }
    const uname = identifier.trim().toLowerCase();
    if (!uname || !password) {
      setError("Bitte geben Sie Ihren Benutzernamen und Ihr Passwort ein.");
      return;
    }
    setBusy(true);
    try {
      const { error: authError } = await supabaseClient.auth.signInWithPassword({ email: synthEmail(uname), password });
      if (authError) {
        const attempts = failedAttempts + 1;
        setFailedAttempts(attempts);
        if (attempts >= 5) setLockedUntil(Date.now() + 60 * 1000);
        setError(attempts >= 5 ? "Zu viele fehlgeschlagene Versuche. Bitte warten Sie 60 Sekunden." : "Benutzername oder Passwort ist ungültig.");
      } else {
        setFailedAttempts(0);
      }
    } catch (authError) {
      setError("Die Anmeldung ist vorübergehend nicht verfügbar. Bitte versuchen Sie es später erneut.");
    } finally {
      setBusy(false);
    }
    /* عند النجاح، App.onAuthStateChange يتولى تحميل الملف الشخصي وتحويل المستخدم تلقائياً */
  }

  return (
    <div className="min-h-screen w-full flex flex-col md:flex-row" style={{ backgroundColor: COLORS.bg }}>

          className="absolute -right-24 -bottom-24 opacity-40 md:opacity-70"
          width="420"
          height="420"
          viewBox="0 0 420 420"
          fill="none"
        >
          <circle cx="150" cy="230" r="95" stroke={COLORS.charcoal} strokeWidth="26" />
          <circle cx="230" cy="230" r="95" stroke={COLORS.red} strokeWidth="26" />
          <circle cx="310" cy="230" r="95" stroke={COLORS.gold} strokeWidth="26" />

        <div className="relative z-10">
          <LogoMark height={40} />

        <div className="relative z-10 mt-16 md:mt-0">

function StudentFormModal({ initial, onSave, onClose, isNew, existingIds, instructors, saving }) {
  const draftKey = `studentFormDraft_${isNew ? "new" : initial.profileId || initial.id}`;
  const [form, setForm] = useState(() => loadLS(draftKey, initial));
  const [idError, setIdError] = useState("");
  const [pwError, setPwError] = useState("");
  const [showCloseConfirm, setShowCloseConfirm] = useState(false);

  useEffect(() => {
    saveLS(draftKey, form);
  }, [draftKey, form]);

  function closeForm() {
    setShowCloseConfirm(true);
  }

  function discardAndClose() {
    try { window.localStorage.removeItem(LS_PREFIX + draftKey); } catch (e) {}
    onClose();
  }

  function set(path, value) {
    setForm((prev) => {
      const next = { ...prev };
      if (path === "financial.total") next.financial = { ...prev.financial, total: value };
      else if (path === "financial.paid") next.financial = { ...prev.financial, paid: value };
      else if (path === "financial.currency") next.financial = { ...prev.financial, currency: value };
      else next[path] = value;
      return next;
    });
  }

  function setId(value) {
    const clean = value.toUpperCase().replace(/\s+/g, "");
    setForm((prev) => ({ ...prev, id: clean }));
    if (!clean.trim()) setIdError("كود الطالب مطلوب — Student-ID ist erforderlich");
    else if ((existingIds || []).includes(clean)) setIdError("هذا الكود مستخدم بالفعل — Diese Student-ID existiert bereits");
    else setIdError("");
  }

  function handleSave() {
    const trimmed = (form.id || "").trim();
    if (!trimmed) {
      setIdError("كود الطالب مطلوب — Student-ID ist erforderlich");
      return;
    }
    if ((existingIds || []).includes(trimmed)) {
      setIdError("هذا الكود مستخدم بالفعل — Diese Student-ID existiert bereits");
      return;
    }
    if (isNew && (!form.password || form.password.length < 6)) {
      setPwError("كلمة السر مطلوبة (6 أحرف على الأقل) لإنشاء حساب الدخول — Passwort erforderlich (mind. 6 Zeichen)");
      return;
    }
    setPwError("");
    onSave({ ...form, id: trimmed }, initial.id);
  }

  function setGrade(i, value) {
    const grades = form.grades.map((g, idx) => (idx === i ? { ...g, score: value } : g));
    setForm((f) => ({ ...f, grades }));
  }

  function addCertificate() {
    setForm((f) => ({ ...f, certificates: [...f.certificates, { title: "", url: "" }] }));
  }
  function setCertificate(i, key, value) {
    setForm((f) => ({
      ...f,
      certificates: f.certificates.map((c, idx) => (idx === i ? { ...c, [key]: value } : c)),
    }));
  }
  function removeCertificate(i) {
    setForm((f) => ({ ...f, certificates: f.certificates.filter((_, idx) => idx !== i) }));
  }

    <div className="fixed inset-0 z-50 flex items-start md:items-center justify-center p-4 overflow-y-auto" style={{ backgroundColor: "rgba(8,21,39,0.55)" }}>

              {isNew ? "إضافة طالب جديد — Neuer Student" : `تعديل بيانات — ${form.name || form.id}`}

              </p>

  );

function AnimatedNumber({ value, duration = 1200, suffix = "", formatter = (n) => n }) {
  const [display, setDisplay] = useState(0);

  useEffect(() => {
    const start = performance.now();
    const end = Number(value) || 0;

    let frame = 0;
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(Math.round(end * eased));
      if (progress < 1) frame = requestAnimationFrame(tick);
    }

    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, [value, duration]);

  return <>{formatter(display)}{suffix}</>;
}

          </article>
        ))}</div>}
      </div>
    </div>
  );
}

  function syncStudentPayment(student, form) {
    const paid = Number(form.financial.paid) || 0;
    const currency = form.financial.currency || "EGP";
    setIncomingFunds((items) => {
      const studentKeys = [student.profileId, student.id, form.profileId, form.id].filter(Boolean);
      const matchingItems = items.filter((item) => item.source === "student-payment" && studentKeys.includes(item.studentId));
      const existingItem = matchingItems[0];
      const remainingItems = items.filter((item) => !(item.source === "student-payment" && studentKeys.includes(item.studentId)));
      if (paid <= 0) return remainingItems;
      const entry = {
        id: existingItem ? existingItem.id : Date.now(),
        source: "student-payment",
        description: "رسوم الكورس — Kursgebühr",
        amount: paid,
        currency,
        date: new Date().toISOString().slice(0, 10),
        studentId: student.profileId || student.id || form.profileId || form.id,
        studentName: `${student.name || form.name} (${student.id || form.id})`,
        receivedDate: new Date().toISOString().slice(0, 10),
        dueDate: "",
        status: "paid",
        paymentMethod: "student-account",
        receipt: existingItem ? existingItem.receipt || "" : "",
      };
      return [entry, ...remainingItems];
    });
  }

  function reconcileAllStudentPayments(studentRows) {
    setIncomingFunds((items) => {
      const automaticItems = items.filter((item) => item.source === "student-payment");
      const manualItems = items.filter((item) => item.source !== "student-payment");
      const syncedItems = studentRows
        .map((student) => {
          const paid = Number(student.financial?.paid) || 0;
          if (paid <= 0) return null;
          const studentName = `${student.name} (${student.id})`;
          const existing = automaticItems.find((item) => item.studentId === student.profileId || item.studentId === student.id || item.studentName === studentName);
          return {
            id: existing?.id || `student-payment-${student.profileId || student.id}`,
            source: "student-payment",
            description: "رسوم الكورس — Kursgebühr",
            amount: paid,
            currency: student.financial?.currency || "EGP",
            date: existing?.date || new Date().toISOString().slice(0, 10),
            studentId: student.profileId || student.id,
            studentName,
            receivedDate: existing?.receivedDate || student.joinDate || new Date().toISOString().slice(0, 10),
            dueDate: existing?.dueDate || "",
            status: "paid",
            paymentMethod: existing?.paymentMethod || "student-account",
            receipt: existing?.receipt || "",
          };
        })
        .filter(Boolean);
      return [...syncedItems, ...manualItems];
    });
  }

  async function saveStudent(form, originalId) {
    if (!isAdmin) {
      setErrorMsg("لا تملك صلاحية تعديل بيانات الطلاب. يجب أن يمنحك الأدمن الإذن أولاً.");
      return;
    }
    setErrorMsg("");
    setSaving(true);
    try {
      const isNewStudent = !form.profileId;
      if (profile?.role === "admin" && form.libraryAccessEnabled === true && !window.confirm("تأكيد فتح المكتبة لهذا الطالب؟ سيتم منحه صلاحية الوصول إلى المواد التعليمية.")) {
        setSaving(false);
        return;
      }
      if (isNewStudent) {
        await callManageUsers({
          action: "create_user",
          role: "student",
          username: form.id,
          password: form.password,
          full_name: form.name,
          name_ar: form.nameAr,
          contact_email: form.contactEmail,
          phone: form.phone,
          join_date: form.joinDate,
          level: form.level,
          status: form.status,
          total: form.financial.total,
          paid: form.financial.paid,
          currency: form.financial.currency,
          wallet: form.wallet,
          discount: form.discount,
          discount_type: form.discountType,
          tax_percent: form.taxPercent,
          grades: form.grades,
          certificates: form.certificates,
          instructor_id: form.instructorId || null,
          group_name: form.groupName || "",
          previous_courses: form.previousCourses || "",
          total_fees_paid: Number(form.totalFeesPaid) || 0,
          education_level: form.educationLevel || "",
          guardian_name: form.guardianName || "",
          guardian_phone: form.guardianPhone || "",
          guardian_relation: form.guardianRelation || "",
          library_access_enabled: profile?.role === "admin" && form.libraryAccessEnabled === true,
          library_access_password: profile?.role === "admin" ? (form.libraryAccessPassword || "") : "",
        });
      } else {
        const { error: pErr } = await supabaseClient
          .from("profiles")
          .update({ full_name: form.name, name_ar: form.nameAr, contact_email: form.contactEmail, phone: form.phone })
          .eq("id", form.profileId);
        if (pErr) throw new Error(pErr.message);

        const { error: sErr } = await supabaseClient
          .from("students")
          .update({
            level: form.level,
            status: form.status,
            join_date: form.joinDate,
            total: form.financial.total,
            paid: form.financial.paid,
            currency: form.financial.currency,
            wallet: form.wallet,
            discount: form.discount,
            discount_type: form.discountType,
            tax_percent: form.taxPercent,
            grades: form.grades,
            certificates: form.certificates,
            instructor_id: form.instructorId || null,
            group_name: form.groupName || "",
            previous_courses: form.previousCourses || "",
            total_fees_paid: Number(form.totalFeesPaid) || 0,
            education_level: form.educationLevel || "",
            guardian_name: form.guardianName || "",
            guardian_phone: form.guardianPhone || "",
            guardian_relation: form.guardianRelation || "",
            library_access_enabled: profile?.role === "admin" && form.libraryAccessEnabled === true,
            library_access_password: profile?.role === "admin" ? (form.libraryAccessPassword || "") : "",
          })
          .eq("profile_id", form.profileId);
        if (sErr) throw new Error(sErr.message);

        if (form.password && form.password.trim()) {
          await callManageUsers({ action: "reset_password", profile_id: form.profileId, new_password: form.password, username: form.id });
        }
        await addLog("تعديل بيانات طالب", `${form.name || form.id} (${form.id})`);
      }
      await refreshStudents();
      let savedStudent;
      let newStudentRow = null;
      if (isNewStudent) {
        await new Promise(resolve => setTimeout(resolve, 300));
        const { data } = await supabaseClient.from("students").select("*").eq("username", form.id).single();
        newStudentRow = data;
        if (newStudentRow) {
          const { data: profileData } = await supabaseClient.from("profiles").select("id, username, full_name, name_ar, contact_email, phone").eq("id", newStudentRow.profile_id).single();
          const savedProfile = profileData || {};
          savedStudent = mapStudentRow({ ...newStudentRow, username: savedProfile.username || newStudentRow.username, name: savedProfile.full_name || newStudentRow.name, name_ar: savedProfile.name_ar || newStudentRow.name_ar, contact_email: savedProfile.contact_email || newStudentRow.contact_email, phone: savedProfile.phone || newStudentRow.phone });
        }
      } else {
        savedStudent = students.find((student) => student.profileId === form.profileId);
      }
      if (!savedStudent) savedStudent = { ...form, profileId: form.profileId || newStudentRow?.profile_id, id: form.id, name: form.name };
      syncStudentPayment(savedStudent, form);
      notifyPortalSync("student_data_changed", { profileId: form.profileId || savedStudent.profileId, studentId: form.id || savedStudent.id, instructorId: form.instructorId || savedStudent.instructorId || null, timestamp: Date.now() });
      try {
        window.localStorage.removeItem(LS_PREFIX + `studentFormDraft_${isNewStudent ? "new" : form.profileId || form.id}`);
      } catch (e) {}
      setModal(null);
      setErrorMsg("SUCCESS: تم حفظ بيانات الطالب وتحديثها بنجاح.");
      if (isNewStudent) {
        setSelectedStudent(savedStudent);
        await new Promise(resolve => setTimeout(resolve, 500));
        setAdminView("student");
        window.location.hash = "student";
      }
    } catch (e) {
      setErrorMsg(e.message || "حدث خطأ أثناء الحفظ.");
    } finally {
      setSaving(false);
    }
  }

      return;

      if (view === "instructors") refreshInstructors();
      if (view === "log") refreshLog();
      if (logAction) addLog(logAction, logDetails);
      setTransitioningView(null);
    }, 120);
  }

      return;

    if (adminView === "financial") {

        Object.entries(form).some(([key, value]) => key !== "receipt" && String(value || "").trim())
      );
      if (hasUnsavedFinancialChanges) {
        setPendingNavigation({ view, logAction, logDetails });
        return;
      }
    }


    performNavigation(view, logAction, logDetails);
  }

  async function addAdminLibraryBook(book) {
    let url = book.url.trim();
    let uploadedPath = "";
    if (book.file) {
      if (book.file.size > 25 * 1024 * 1024) throw new Error("حجم الملف الرقمي يجب ألا يتجاوز 25 ميجابايت.");
      const safeName = book.file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      uploadedPath = `${profile.id}/${Date.now()}-${safeName}`;
      const fileExtension = book.file.name.toLowerCase().split(".").pop();
      const contentType = fileExtension === "html" || fileExtension === "htm" ? "text/html" : (book.file.type || "application/octet-stream");
      const { error: uploadError } = await supabaseClient.storage.from("course-library").upload(uploadedPath, book.file, { upsert: false, contentType, cacheControl: "3600" });
      if (uploadError) throw new Error(`تعذر رفع الملف: ${uploadError.message}`);
      url = "";
    }
    if (!url && book.libraryType === "paper" && !uploadedPath) url = `paper://${encodeURIComponent(book.title.trim())}`;
    const { error } = await supabaseClient.from("course_library").insert({ level: book.level, library_type: book.libraryType, category: book.category, title: book.title.trim(), url, storage_path: uploadedPath || null, visible: true, student_download_enabled: true, instructor_profile_id: profile.id });
    if (error) {
      if (uploadedPath) await supabaseClient.storage.from("course-library").remove([uploadedPath]);

    await refreshLibrary();

function EmployeeWorkPage({ profile, employees, sessions, onSaveSession, onUpdateSession }) {
  const [now, setNow] = useState(Date.now());
  const [breakUntil, setBreakUntil] = useState(() => Number(loadLS(`breakUntil_${profile.id}`, 0)) || 0);
  const [alarmActive, setAlarmActive] = useState(false);
  const alarmRef = useRef(null);
  const isAdmin = profile.role === "admin";
  const canReturn = employeeHasPermission(profile, "return_to_employee_management");
  const canEdit = employeeHasPermission(profile, "edit_work_hours");
  const today = new Date().toISOString().slice(0, 10);
  const ownSessions = sessions.filter((item) => item.employeeProfileId === profile.id && item.workDate === today);
  const active = ownSessions.find((item) => item.startedAt && !item.endedAt);
  const elapsed = active ? Math.max(0, now - new Date(active.startedAt).getTime() - active.breakMinutes * 60000) : 0;

  useEffect(() => { const timer = window.setInterval(() => setNow(Date.now()), 1000); return () => window.clearInterval(timer); }, []);
  useEffect(() => {
    if (breakUntil && breakUntil <= Date.now()) {
      setBreakUntil(0);
      saveLS(`breakUntil_${profile.id}`, 0);
      setAlarmActive(true);
    }
  }, [now, breakUntil, profile.id]);

  useEffect(() => {
    if (!alarmActive) return undefined;
    playBellTone();
    alarmRef.current = window.setInterval(playBellTone, 900);
    return () => { if (alarmRef.current) { window.clearInterval(alarmRef.current); alarmRef.current = null; } };
  }, [alarmActive]);

  useEffect(() => {
    document.querySelectorAll("select").forEach((select) => {
      if (!Array.from(select.options).some((option) => option.textContent === "يعمل")) return;
      const current = select.value;
      select.innerHTML = WORK_STATUS_OPTIONS.map((option) => `<option value="${option[0]}">${option[1]} — ${option[2]}</option>`).join("");
      select.value = current;
    });
  }, [sessions]);

  function duration(ms) { const total = Math.floor(ms / 1000); return `${String(Math.floor(total / 3600)).padStart(2, "0")}:${String(Math.floor(total / 60) % 60).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`; }
  function stopAlarm() { setAlarmActive(false); if (alarmRef.current) { window.clearInterval(alarmRef.current); alarmRef.current = null; } }
  function changeStatus(id, status) { if (!canEdit && !isAdmin) return; if (window.confirm(`تأكيد تغيير الحالة إلى ${workStatusLabel(status)}؟`)) { stopAlarm(); onUpdateSession(id, { status }); } }
  function startBreak(minutes, status = "break") { if (!active || !canEdit) return; const durationMinutes = minutes === 15 ? 10 : minutes === 60 ? 20 : minutes; const effectiveStatus = minutes === 60 ? "lunch" : status; stopAlarm(); const until = Date.now() + durationMinutes * 60000; setBreakUntil(until); saveLS(`breakUntil_${profile.id}`, until); onUpdateSession(active.id, { status: effectiveStatus, break_minutes: active.breakMinutes + durationMinutes }); }
  function exportCsv() {
    const lines = [["الموظف", "التاريخ", "بداية الدوام", "نهاية الدوام", "الدقائق", "الحالة"]];
    sessions.forEach((item) => { const employee = employees.find((entry) => entry.id === item.employeeProfileId); lines.push([employee?.full_name || employee?.username || item.employeeProfileId, item.workDate, item.startedAt || "", item.endedAt || "", item.breakMinutes, item.status]); });
    const blob = new Blob(["\ufeff" + lines.map((row) => row.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "dos-employee-work-hours.csv"; link.click(); URL.revokeObjectURL(link.href);
  }
  return <div className="max-w-6xl mx-auto px-5 md:px-8 py-8"><button onClick={() => { window.location.hash = "accounts"; }} className="flex items-center gap-1.5 text-sm font-semibold mb-5" style={{ color: COLORS.navy }}><Icon.back /> رجوع إلى إدارة الموظفين</button><div className="relative overflow-hidden rounded-[28px] border p-6 md:p-9" style={{ borderColor: "rgba(227,168,37,.38)", background: `linear-gradient(115deg, ${COLORS.navyDeep}, ${COLORS.navyMid})`, color: "#fff" }}><div className="absolute inset-y-0 right-0 w-2/5 bg-cover bg-center opacity-35" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=900&q=80')" }} /><div className="relative z-10 max-w-2xl"><p className="text-xs uppercase tracking-[.22em]" style={{ color: COLORS.goldSoft }}>DOS AKADEMIE · MITARBEITERPORTAL</p><h1 className="mt-3 text-2xl md:text-4xl font-semibold" style={{ fontFamily: F_DISPLAY }}>Willkommen, {profile.full_name || profile.username}</h1><p className="mt-2 text-sm" style={{ color: "#D9E3F0" }}>لوحة العمل اليومية للموظفين والمحاسبين · بيانات منظمة وأوامر واضحة</p></div></div><div className="mt-5 rounded-2xl border p-6" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}><div className="flex flex-wrap items-center justify-between gap-3"><div><h2 className="text-xl font-semibold" style={{ color: COLORS.ink, fontFamily: F_DISPLAY }}>ساعات العمل — Arbeitszeit</h2><p className="text-sm mt-1" style={{ color: COLORS.subtle }}>{profile.role === "accountant" ? "محاسب — Buchhalter" : "موظف — Mitarbeiter"} · {today}</p></div>{isAdmin && <button onClick={() => { if (window.confirm("هل تريد تنزيل سجل ساعات الموظفين؟")) exportCsv(); }} className="rounded-lg px-4 py-2 text-sm font-semibold" style={{ backgroundColor: COLORS.gold, color: COLORS.navyDeep }}>تنزيل سجل الساعات CSV</button>}</div>{!isAdmin && <div className="mt-6 rounded-xl border p-5" style={{ borderColor: COLORS.border, backgroundColor: "#F7F9FB" }}><p className="text-4xl font-semibold" style={{ color: COLORS.navy, fontFamily: F_MONO }}>{duration(elapsed)}</p><p className="mt-2 text-sm" style={{ color: COLORS.subtle }}>{active ? (breakUntil ? `راحة متبقية ${duration(Math.max(0, breakUntil - now))}` : "الدوام جارٍ") : "لم يبدأ دوام اليوم"}</p><div className="flex flex-wrap gap-2 mt-4">{!active ? <button onClick={() => { if (window.confirm("هل تريد بدء دوام اليوم؟")) onSaveSession({ employee_profile_id: profile.id, work_date: today, started_at: new Date().toISOString(), status: "working" }); }} className="rounded-lg px-4 py-2 text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>بدء الدوام</button> : <><button onClick={() => { if (window.confirm("هل تريد إنهاء الدوام الآن؟")) { stopAlarm(); onUpdateSession(active.id, { ended_at: new Date().toISOString(), status: "offline" }); } }} className="rounded-lg px-4 py-2 text-sm font-semibold" style={{ backgroundColor: COLORS.red, color: "#fff" }}>إنهاء الدوام</button><button onClick={() => startBreak(15)} className="rounded-lg border px-4 py-2 text-sm font-semibold" style={{ borderColor: COLORS.gold, color: COLORS.goldDark }}>راحة 15 دقيقة</button><button onClick={() => startBreak(60)} className="rounded-lg border px-4 py-2 text-sm font-semibold" style={{ borderColor: COLORS.navy, color: COLORS.navy }}>راحة ساعة</button></>}</div></div>}<div className="mt-6 space-y-2">{isAdmin && sessions.map((item) => { const employee = employees.find((entry) => entry.id === item.employeeProfileId); return <div key={item.id} className="flex flex-wrap items-center justify-between gap-3 rounded-xl border p-3" style={{ borderColor: COLORS.border }}><span className="text-sm font-semibold">{employee?.full_name || employee?.username || item.employeeProfileId}<small className="block text-xs font-normal" style={{ color: COLORS.subtle }}>{item.workDate} · {item.startedAt ? new Date(item.startedAt).toLocaleTimeString() : "—"}</small></span><select value={item.status} onChange={(event) => { if (window.confirm("هل تريد تغيير حالة الموظف؟")) { stopAlarm(); onUpdateSession(item.id, { status: event.target.value }); } }} className={inputCls} style={{ ...inputStyle, maxWidth: 180 }}><option value="working">يعمل</option><option value="break">في راحة</option><option value="offline">لا يعمل</option><option value="leave">إجازة</option><option value="sick">مرضي</option><option value="vacation">عطلة</option><option value="training">تدريب</option><option value="meeting">اجتماع</option><option value="call">مكالمة</option><option value="lunch">غداء</option></select></div>; })}</div></div></div>;
}

function AdminAccountsPage({ adminAccounts, refreshAdmins, currentAdmin, addLog, onBack, onUpdateAccount }) {
  const [form, setForm] = useState({ username: "", password: "", name: "", email: "", role: "staff", jobTitle: "موظف", hireDate: "", salary: "", permissions: DEFAULT_EMPLOYEE_PERMISSIONS.staff });
  const [editingId, setEditingId] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const role = form.role === "accountant" || /محاسب|buchhalter|accountant/i.test(form.jobTitle || "") ? "accountant" : form.role === "admin" ? "admin" : "staff";

  function selectAccount(account) {
    setEditingId(account.id);
    setForm({ username: account.username || "", password: "", name: account.full_name || "", email: account.contact_email || "", role: account.role || "staff", jobTitle: account.job_title || "موظف", hireDate: account.join_date || "", salary: account.salary || "", permissions: Array.isArray(account.permissions) ? account.permissions : (DEFAULT_EMPLOYEE_PERMISSIONS[account.role] || []) });
    setError("");
  }

  async function addAccount(e) {
    e.preventDefault();
    setError("");
    const uname = form.username.trim();
    const fullName = form.name.trim();
    const email = form.email.trim();
    if (!uname || !fullName || !form.password || form.password.length < 6) {
      setError("يرجى إدخال الاسم واسم المستخدم وكلمة مرور (6 أحرف على الأقل) — Bitte Name, Benutzername und Passwort angeben.");
      return;
    }
    if (adminAccounts.some((a) => a.username.toLowerCase() === uname.toLowerCase())) {
      setError("اسم المستخدم مستخدم بالفعل — Benutzername existiert bereits.");
      return;
    }
    setBusy(true);
    try {
      await callManageUsers({
        action: "create_user",
        role,
        username: uname,
        password: form.password,
        full_name: fullName,
        contact_email: email || `${uname}@dos-academy.local`,
        hire_date: form.hireDate || new Date().toISOString().slice(0, 10),
        salary: Number(form.salary) || 0,
        permissions: form.permissions,
      });
      await refreshAdmins();
      setForm({ username: "", password: "", name: "", email: "", role: "staff", jobTitle: "موظف", hireDate: "", salary: "", permissions: DEFAULT_EMPLOYEE_PERMISSIONS.staff });
      if (addLog) addLog("إنشاء موظف جديد", `${fullName} (${uname})`);
    } catch (e2) {
      setError(e2.message || "تعذّر إنشاء الحساب.");
    } finally {
      setBusy(false);
    }
  }

  async function savePermissions() {
    if (!editingId || !onUpdateAccount) return;
    setBusy(true);
    try {
      await onUpdateAccount(editingId, { permissions: form.permissions, role });
      setEditingId(null);
      setForm({ username: "", password: "", name: "", email: "", role: "staff", jobTitle: "موظف", hireDate: "", salary: "", permissions: DEFAULT_EMPLOYEE_PERMISSIONS.staff });
    } catch (e) { setError(e.message || "تعذر حفظ الصلاحيات."); } finally { setBusy(false); }
  }

  function requestAccountDeletion(a) {
    if (a.username === currentAdmin) return;
    if (adminAccounts.length <= 1) return;
    setDeleteTarget(a);
  }

  async function removeAccount() {
    if (!deleteTarget) return;
    try {
      await callManageUsers({ action: "delete_user", profile_id: deleteTarget.id, username: deleteTarget.username });
      await refreshAdmins();
    } catch (e) {
      setError(e.message || "تعذّر حذف الحساب.");
    } finally {
      setDeleteTarget(null);
    }
  }

  function roleLabel(value) {
    return ({ admin: "مدير — Administrator", accountant: "محاسب — Buchhalter", staff: "موظف — Mitarbeiter" }[value] || "موظف — Mitarbeiter");
  }

  function permissionLabels(account) {
    let permissions = account.permissions;
    if (typeof permissions === "string") {
      try { permissions = JSON.parse(permissions); } catch (error) { permissions = []; }
    }
    if (!Array.isArray(permissions)) permissions = DEFAULT_EMPLOYEE_PERMISSIONS[account.role] || [];
    return permissions.map((permission) => EMPLOYEE_PERMISSION_OPTIONS.find((item) => item.value === permission)?.label || permission);
  }

  return (
    <div className="max-w-6xl mx-auto px-5 md:px-8 py-8">
      <button
        onClick={onBack}
        className="flex items-center gap-1.5 text-sm font-semibold mb-5 hover:opacity-80"
        style={{ color: COLORS.navy, fontFamily: F_BODY }}
      >
        <Icon.back /> رجوع إلى لوحة الطلاب — Zurück
      </button>

      <div className="w-full max-w-5xl rounded-2xl border shadow-sm p-6" style={{ backgroundColor: COLORS.panel, borderColor: COLORS.border }}>
        <h3 className="text-base font-semibold mb-5" style={{ color: COLORS.ink, fontFamily: F_DISPLAY }}>
          إدارة الموظفين — Mitarbeiterverwaltung
        </h3>

        <div className="grid md:grid-cols-2 gap-5 mb-6">
          {adminAccounts.map((a) => (
            <div key={a.id} className="flex items-center justify-between px-3.5 py-3 rounded-xl border" style={{ borderColor: COLORS.border }}>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <p className="text-sm font-semibold" style={{ color: COLORS.ink, fontFamily: F_BODY }}>{a.full_name || a.username}</p>
                  {a.username === currentAdmin && <Badge tone="green">أنت</Badge>}
                  {a.role && <Badge tone={a.role === "accountant" ? "gold" : "blue"}>{roleLabel(a.role)}</Badge>}
                </div>
                <p className="text-xs mt-1" style={{ color: COLORS.subtle, fontFamily: F_MONO }}>{a.username}</p>
                <p className="text-xs mt-1" style={{ color: COLORS.subtle, fontFamily: F_BODY }}>{a.contact_email || a.email || "—"} · {a.job_title || a.role || "موظف"}</p>
                <div className="mt-2 flex flex-wrap gap-1">
                  {permissionLabels(a).length ? permissionLabels(a).map((permission) => <span key={permission} className="rounded-full px-2 py-0.5 text-[10px]" style={{ backgroundColor: "#EAF0F8", color: COLORS.navy }}>{permission}</span>) : <span className="text-[10px]" style={{ color: COLORS.subtle }}>لا توجد صلاحيات مسندة</span>}
                </div>
              </div>
              <button
                onClick={() => selectAccount(a)}
                disabled={a.username === currentAdmin || adminAccounts.length <= 1 || busy}
                className="p-1.5 rounded-lg hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed"
                style={{ color: COLORS.red }}
                title="تعديل الصلاحيات"
              >
                <Icon.edit />
              </button>
              <button onClick={() => requestAccountDeletion(a)} disabled={a.username === currentAdmin || adminAccounts.length <= 1 || busy} className="p-1.5 rounded-lg hover:bg-gray-100 disabled:opacity-30" style={{ color: COLORS.red }} title="حذف الحساب"><Icon.trash /></button>
            </div>
          ))}
        </div>

        <form onSubmit={addAccount} className="space-y-3 pt-4 border-t" style={{ borderColor: COLORS.border }}>
          <p className="text-sm font-semibold" style={{ color: COLORS.ink, fontFamily: F_BODY }}>
            {editingId ? "تعديل صلاحيات الموظف — Mitarbeiterrechte bearbeiten" : "إنشاء حساب موظف جديد — Neuer Mitarbeiter anlegen"}
          </p>

          {!editingId && <div className="grid md:grid-cols-2 gap-3">
            <Field label="الاسم — Name">
              <input className={inputCls} style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            </Field>
            <Field label="البريد الإلكتروني — E-Mail">
              <input type="email" className={inputCls} style={inputStyle} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
            </Field>
            <Field label="اسم المستخدم — Benutzername">
              <input className={inputCls} style={inputStyle} value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} />
            </Field>
            <Field label="كلمة المرور — Passwort">
              <input type="password" className={inputCls} style={inputStyle} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
            </Field>
            <Field label="تاريخ التوظيف — Einstellungsdatum">
              <input type="date" className={inputCls} style={inputStyle} value={form.hireDate} onChange={(e) => setForm({ ...form, hireDate: e.target.value })} />
            </Field>
            <Field label="المرتب — Gehalt">
              <input type="number" min="0" step="0.01" className={inputCls} style={inputStyle} value={form.salary} onChange={(e) => setForm({ ...form, salary: e.target.value })} />
            </Field>
            <Field label="الصفة/الوظيفة — Position">
              <input className={inputCls} style={inputStyle} value={form.jobTitle} onChange={(e) => setForm({ ...form, jobTitle: e.target.value })} placeholder="محاسب / موظف / مدير" />
            </Field>
            <Field label="نوع الحساب — Kontotyp">
              <select className={inputCls} style={inputStyle} value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value, jobTitle: e.target.value === "accountant" ? "محاسب" : e.target.value === "admin" ? "مدير" : form.jobTitle || "موظف" })}>
                {EMPLOYEE_ROLE_OPTIONS.map((option) => (
                  <option key={option.value} value={option.value}>{option.label}</option>
                ))}
              </select>
            </Field>
          </div>}

          <div className="rounded-xl border p-4" style={{ borderColor: COLORS.border, backgroundColor: "#F7F9FB" }}>
            <div className="flex items-center justify-between gap-2 mb-3"><strong className="text-sm" style={{ color: COLORS.ink }}>الصلاحيات — Berechtigungen</strong><span className="text-xs" style={{ color: COLORS.subtle }}>الأدمن وحده يغيّرها</span></div>
            <div className="grid md:grid-cols-2 gap-2">{EMPLOYEE_PERMISSION_OPTIONS.map((permission) => <label key={permission.value} className="flex items-center gap-2 rounded-lg border px-3 py-2 text-xs" style={{ borderColor: COLORS.border, backgroundColor: "#fff" }}><input type="checkbox" checked={form.permissions.includes(permission.value)} onChange={(e) => setForm({ ...form, permissions: e.target.checked ? [...form.permissions, permission.value] : form.permissions.filter((item) => item !== permission.value) })} />{permission.label}</label>)}</div>
          </div>

          {role === "accountant" && (
            <div className="rounded-xl border p-3 text-sm" style={{ borderColor: COLORS.border, backgroundColor: "#FFF8E8", color: COLORS.ink, fontFamily: F_BODY }}>
              <strong>صلاحيات المحاسب:</strong> يُسمح بإضافة الطلاب، إنشاء الفواتير، تعديلها، مع حظر عرض بيانات الأكاديمية المالية. في حال الحاجة للتعديل، يكون التعديل على بيانات الطالب فقط من خلال إدارة الموظفين والادمن.
            </div>
          )}

          {error && (
            <p className="text-sm rounded-lg px-3 py-2" style={{ backgroundColor: "#FBE7E9", color: COLORS.red, fontFamily: F_BODY }}>
              {error}
            </p>
          )}
          {editingId && <button type="button" onClick={savePermissions} disabled={busy} className="w-full py-2.5 rounded-lg border font-semibold text-sm" style={{ borderColor: COLORS.navy, color: COLORS.navy }}>حفظ الصلاحيات — Rechte speichern</button>}
          {!editingId && <button
            type="submit"
            disabled={busy}
            className="w-full py-2.5 rounded-lg font-semibold text-sm hover:opacity-90 disabled:opacity-60"
            style={{ backgroundColor: COLORS.navy, color: "#fff", fontFamily: F_BODY }}
          >
            <span className="inline-flex items-center gap-1.5"><Icon.plus /> {busy ? "جارٍ الإنشاء..." : "إنشاء الحساب — Konto erstellen"}</span>
          </button>}
          {editingId && <button type="button" onClick={() => { setEditingId(null); setError(""); }} className="w-full py-2.5 rounded-lg border text-sm" style={{ borderColor: COLORS.border, color: COLORS.subtle }}>إلغاء — Abbrechen</button>}
        </form>
      </div>
      {deleteTarget && <ConfirmDialog title="تأكيد حذف الموظف" message={`سيتم حذف حساب ${deleteTarget.full_name || deleteTarget.username} نهائيًا، ولا يمكن التراجع عن هذا الإجراء.`} onConfirm={removeAccount} onClose={() => setDeleteTarget(null)} />}
    </div>
  );
}

/* --------------------------- Instructors page (admin) --------------------------- */

function InstructorsPage({ instructors, students, refreshInstructors, addLog, onBack }) {
  const emptyForm = { username: "", password: "", name: "", nameAr: "", subject: "", phone: "", joinDate: "", salaryTotal: "", salaryPaid: "", paymentDate: "", salaryTotalSinceStart: "", otherPaymentName: "", otherPaymentAmount: "", otherPaymentDetails: "", nextPaymentDate: "", nextPaymentInfo: "", penalties: "", absences: "" };
  const [form, setForm] = useState(emptyForm);
  const [editingInstructor, setEditingInstructor] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function saveInstructor(e) {
    e.preventDefault();
    setError("");
    const uname = form.username.trim();
    if (!uname || (!editingInstructor && (!form.password || form.password.length < 6)) || (editingInstructor && form.password && form.password.length < 6) || !form.name.trim()) {
      setError(editingInstructor ? "يرجى إدخال الاسم، وكلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل." : "يرجى إدخال الاسم واسم المستخدم وكلمة مرور (6 أحرف على الأقل).");
      return;
    }
    if (instructors.some((i) => i.id.toLowerCase() === uname.toLowerCase() && i.profileId !== editingInstructor?.profileId)) {
      setError("اسم المستخدم مستخدم بالفعل — Benutzername existiert bereits.");
      return;
    }
    setBusy(true);
    try {
      if (!editingInstructor) {
        await callManageUsers({
          action: "create_user",
          role: "instructor",
          username: uname,
          password: form.password,
          full_name: form.name.trim(),
          name_ar: form.nameAr.trim(),
          phone: form.phone.trim(),
          subject: form.subject.trim(),
          join_date: form.joinDate || null,
          salary_total: Number(form.salaryTotal) || 0,
          salary_paid: Number(form.salaryPaid) || 0,
          payment_date: form.paymentDate || null,
          salary_total_since_start: Number(form.salaryTotalSinceStart) || 0,
          other_payment_name: form.otherPaymentName.trim(),
          other_payment_amount: Number(form.otherPaymentAmount) || 0,
          other_payment_details: form.otherPaymentDetails.trim(),
          next_payment_date: form.nextPaymentDate || null,
          next_payment_info: form.nextPaymentInfo.trim(),
          penalties: Number(form.penalties) || 0,
          absences: Number(form.absences) || 0,
        });
      } else {
        const { error: profileError } = await supabaseClient
          .from("profiles")
          .update({ full_name: form.name.trim(), name_ar: form.nameAr.trim(), phone: form.phone.trim() })
          .eq("id", editingInstructor.profileId);
        if (profileError) throw new Error(profileError.message);

        const { error: instructorError } = await supabaseClient
          .from("instructors")
          .update({
            subject: form.subject.trim(),
            join_date: form.joinDate || null,
            salary_total: Number(form.salaryTotal) || 0,
            salary_paid: Number(form.salaryPaid) || 0,
            payment_date: form.paymentDate || null,
            salary_total_since_start: Number(form.salaryTotalSinceStart) || 0,
            other_payment_name: form.otherPaymentName.trim(),
            other_payment_amount: Number(form.otherPaymentAmount) || 0,
            other_payment_details: form.otherPaymentDetails.trim(),
            next_payment_date: form.nextPaymentDate || null,
            next_payment_info: form.nextPaymentInfo.trim(),
            penalties: Number(form.penalties) || 0,
            absences: Number(form.absences) || 0,
          })
          .eq("profile_id", editingInstructor.profileId);
        if (instructorError) throw new Error(instructorError.message);

        if (form.password) {
          await callManageUsers({ action: "reset_password", profile_id: editingInstructor.profileId, new_password: form.password, username: uname });
        }
      }
      await refreshInstructors();
      setError("SUCCESS: تم حفظ بيانات المحاضر بنجاح.");
      setForm(emptyForm);
      setEditingInstructor(null);
    } catch (e2) {
      setError(e2.message || (editingInstructor ? "تعذّر تعديل حساب المحاضر." : "تعذّر إنشاء حساب المحاضر."));
    } finally {
      setBusy(false);
    }
  }

  function editInstructor(ins) {
    setError("");
    setEditingInstructor(ins);
    setForm({
      username: ins.id || "",
      password: "",
      name: ins.name || "",
      nameAr: ins.nameAr || "",
      subject: ins.subject || "",
      phone: ins.phone || "",
      joinDate: ins.joinDate || "",
      salaryTotal: ins.salaryTotal || "",
      salaryPaid: ins.salaryPaid || "",
      paymentDate: ins.paymentDate || "",
      salaryTotalSinceStart: ins.salaryTotalSinceStart || "",
      otherPaymentName: ins.otherPaymentName || "",
      otherPaymentAmount: ins.otherPaymentAmount || "",
      otherPaymentDetails: ins.otherPaymentDetails || "",
      nextPaymentDate: ins.nextPaymentDate || "",
      nextPaymentInfo: ins.nextPaymentInfo || "",
      penalties: ins.penalties || "",
      absences: ins.absences || "",
    });
  }

  function cancelEdit() {
    setEditingInstructor(null);
    setForm(emptyForm);
    setError("");
  }

  function requestInstructorDeletion(ins) {
    setDeleteTarget(ins);
  }

  async function removeInstructor() {
    const ins = deleteTarget;
    if (!ins) return;
    try {
      await callManageUsers({ action: "delete_user", profile_id: ins.profileId, username: ins.id });
      await refreshInstructors();
    } catch (e) {
      setError(e.message || "تعذّر حذف حساب المحاضر.");
    } finally {
      setDeleteTarget(null);
    }
  }

  function assignedCount(ins) {
    return students.filter((s) => s.instructorId === ins.profileId).length;
  }

  return (
    <div className="max-w-6xl mx-auto px-5 md:px-8 py-8">
      <button
        onClick={onBack}
        className="flex items-center gap-1.5 text-sm font-semibold mb-5 hover:opacity-80"
        style={{ color: COLORS.navy, fontFamily: F_BODY }}
      >
        <Icon.back /> رجوع إلى لوحة الطلاب — Zurück

      setTransferReceipt(dataUrl);

function isHtmlLibraryFile(book) {
  return /\.html?($|[?#])/i.test([book.url, book.title, book.storagePath].filter(Boolean).join(" "));
}

function isAudioLibraryFile(book) {
  return /\.(mp3|wav|m4a|ogg|aac|webm)($|[?#])/i.test([book.url, book.title, book.storagePath].filter(Boolean).join(" "));
}

function isVideoLibraryFile(book) {
  return /\.(mp4|webm|mov|m4v)($|[?#])/i.test([book.url, book.title, book.storagePath].filter(Boolean).join(" "));
}

function isPdfLibraryFile(book) {
  return /\.pdf($|[?#])/i.test([book.url, book.title, book.storagePath].filter(Boolean).join(" "));
}

  if (error || !data.session?.access_token) throw new Error("سجّل الدخول مجدداً لعرض محتوى المكتبة.");
  const response = await fetch(`${SUPABASE_URL}/functions/v1/library-content`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${data.session.access_token}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ storagePath }),
    signal,
  });
  if (!response.ok) {
    const result = await response.json().catch(() => ({}));
    throw new Error(result.error || "تعذر تحميل محتوى المكتبة.");
  }
  return response.blob();
}

function LibraryFileViewer({ book, onClose }) {
  const [documentHtml, setDocumentHtml] = useState("");
  const [fileUrl, setFileUrl] = useState("");
  const [loadError, setLoadError] = useState("");

  useEffect(() => {
    if (!book.storagePath) {
      setFileUrl(book.url || "");
      setDocumentHtml("");
      setLoadError("");
      return undefined;
    }

    let objectUrl = "";
    let cancelled = false;
    const controller = new AbortController();
    setDocumentHtml("");
    setFileUrl("");
    setLoadError("");

    downloadProtectedLibraryFile(book.storagePath, controller.signal)
      .then((data) => {
        if (!data) throw new Error("تعذر تحميل الملف من المكتبة.");
        if (cancelled) return "";
        objectUrl = URL.createObjectURL(data);
        setFileUrl(objectUrl);
        if (isHtmlLibraryFile(book)) return data.text();
        return "";
      })
      .then((source) => {
        if (!source || cancelled) return;
        const parsed = new DOMParser().parseFromString(source, "text/html");
        let base = parsed.querySelector("base");
        if (!base) {
          base = parsed.createElement("base");
          parsed.head.prepend(base);
        }
        base.href = book.url ? new URL(".", book.url).href : window.location.href;
        const protectionStyle = parsed.createElement("style");
        protectionStyle.textContent = "html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img{-webkit-user-drag:none;user-drag:none}";
        parsed.head.append(protectionStyle);
        const protectionScript = parsed.createElement("script");
        protectionScript.textContent = "document.addEventListener('contextmenu',function(event){event.preventDefault()},true);document.addEventListener('dragstart',function(event){event.preventDefault()},true);document.addEventListener('keydown',function(event){if((event.ctrlKey||event.metaKey)&&['s','p','u'].includes(event.key.toLowerCase()))event.preventDefault()},true);document.addEventListener('click',function(event){var link=event.target.closest('a[href]');if(link&&!link.getAttribute('href').startsWith('#'))event.preventDefault()},true);";
        parsed.head.append(protectionScript);
        setDocumentHtml(`<!doctype html>${parsed.documentElement.outerHTML}`);
      })
      .catch((error) => {
        if (!cancelled) setLoadError(error.message || "تعذر عرض الملف.");
      });

    return () => {
      cancelled = true;
      controller.abort();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    };
  }, [book]);

  const uploadedHtml = Boolean(book.storagePath && isHtmlLibraryFile(book));
  const loading = !loadError && (book.storagePath ? (uploadedHtml ? !documentHtml : !fileUrl) : !fileUrl);
  const protectedDigitalBook = book.libraryType === "digital";
  const viewerSource = !uploadedHtml && isPdfLibraryFile(book) && fileUrl ? `${fileUrl}#toolbar=0&navpanes=0` : fileUrl;
  const mediaClass = "max-h-full max-w-full rounded-lg";
  let content = <iframe title={book.title} src={uploadedHtml ? undefined : viewerSource} srcDoc={uploadedHtml ? documentHtml : undefined} sandbox="allow-scripts allow-forms allow-modals" referrerPolicy="no-referrer" loading="eager" className="min-h-0 w-full flex-1 border-0" onContextMenu={protectedDigitalBook ? (event) => event.preventDefault() : undefined} />;
  if (isAudioLibraryFile(book)) content = <div className="flex min-h-0 flex-1 items-center justify-center p-5"><audio src={fileUrl} controls controlsList="nodownload noplaybackrate noremoteplayback" onContextMenu={(event) => event.preventDefault()} className="w-full max-w-2xl" /></div>;
  else if (isVideoLibraryFile(book)) content = <div className="flex min-h-0 flex-1 items-center justify-center bg-black p-2"><video src={fileUrl} controls controlsList="nodownload noplaybackrate noremoteplayback" disablePictureInPicture onContextMenu={(event) => event.preventDefault()} className={mediaClass} /></div>;
  else if (/\.(png|jpe?g|gif|webp|avif)($|[?#])/i.test([book.url, book.title, book.storagePath].filter(Boolean).join(" "))) content = <div className="flex min-h-0 flex-1 items-center justify-center overflow-auto p-3"><img src={fileUrl} alt={book.title} draggable="false" onContextMenu={(event) => event.preventDefault()} className={mediaClass} /></div>;
  return <div className="fixed inset-0 z-[90] flex items-center justify-center p-2 sm:p-4" onContextMenu={protectedDigitalBook ? (event) => event.preventDefault() : undefined} style={{ backgroundColor: "rgba(8,21,39,.78)", paddingTop: "max(8px, env(safe-area-inset-top))", paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}><div className="flex h-[94vh] w-full max-w-6xl flex-col overflow-hidden rounded-xl border bg-white shadow-2xl" style={{ borderColor: COLORS.border, height: "94dvh" }}><div className="flex shrink-0 items-center justify-between gap-2 border-b px-3 py-2.5 sm:px-4"><div className="min-w-0 flex-1"><p className="truncate text-sm font-semibold" style={{ color: COLORS.ink }}>{book.title}</p><p className="text-xs" style={{ color: COLORS.subtle }}>عرض المادة داخل المكتبة الرقمية</p></div><button type="button" onClick={onClose} className="rounded-md border px-2.5 py-1.5 text-xs font-semibold" style={{ borderColor: COLORS.border, color: COLORS.red }}>إغلاق</button></div>{loading && <p className="shrink-0 px-4 py-3 text-sm" style={{ color: COLORS.subtle }}>جارٍ تجهيز واجهة الملف...</p>}{loadError && <p className="shrink-0 px-4 py-3 text-sm" style={{ color: COLORS.red }}>{loadError}</p>}{!loadError && !loading && content}</div></div>;
}

function LibraryPage({ books, initialLevel, editable, onAdd, onDelete, onUpdate, dictionariesOnly = false, studentMode = false }) {
  const [level, setLevel] = useState(initialLevel || LEVELS[0]);
  const [libraryType, setLibraryType] = useState("digital");
  const [form, setForm] = useState({ category: dictionariesOnly ? "dictionary" : "course", title: "", url: "", file: null });
  const [message, setMessage] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ title: "", url: "", category: "course", studentDownloadEnabled: true });
  const [viewerBook, setViewerBook] = useState(null);

  const visibleBooks = books.filter((book) => book.level === level && book.libraryType === libraryType && book.visible !== false && (!dictionariesOnly || book.category === "dictionary"));
  const managedBooks = books.filter((book) => book.level === level && book.libraryType === libraryType && (!dictionariesOnly || book.category === "dictionary"));
  const displayBooks = editable ? managedBooks : visibleBooks;
  const bundledCourses = libraryType === "digital" && !dictionariesOnly ? BUNDLED_DIGITAL_COURSES.filter((course) => course.level === level) : [];

  async function submit(event) {
    event.preventDefault();
    setMessage("");
    if (!form.title.trim() || (libraryType === "digital" && !form.url.trim() && !form.file)) {
      setMessage("أدخل اسم المادة وارفع ملفًا أو أضف رابطًا.");
      return;
    }
    try {
      await onAdd({ ...form, level, libraryType });
      setForm({ ...form, title: "", url: "", file: null });
      setMessage("تمت إضافة المادة بنجاح.");
    } catch (error) {
      setMessage(error.message || "تعذر إضافة المادة.");
    }
  }

  async function downloadPaperBook(book) {
    try {
      const file = book.storagePath
        ? await downloadProtectedLibraryFile(book.storagePath)
        : await fetch(book.url).then((response) => {
          if (!response.ok) throw new Error("تعذر تنزيل الملف الورقي.");
          return response.blob();
        });
      const objectUrl = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = book.title || "paper-library-file";
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    } catch (error) {
      setMessage(error.message || "تعذر تنزيل الملف الورقي.");
    }
  }

  function beginEdit(book) {
    setEditingId(book.id);
    setEditForm({ title: book.title || "", url: book.url || "", category: book.category || "course", studentDownloadEnabled: book.studentDownloadEnabled !== false });
  }

  function renderBook(book) {
    const link = book.url || "#";
    const isPaper = book.libraryType === "paper";
    const isAudio = !isPaper && isAudioLibraryFile(book);
    return (
      <div key={book.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b py-2" style={{ borderColor: COLORS.border }}>
        {editingId === book.id ? (
          <div className="grid flex-1 grid-cols-1 gap-2 sm:grid-cols-2">
            <input className={inputCls} style={inputStyle} value={editForm.title} onChange={(event) => setEditForm({ ...editForm, title: event.target.value })} />
            <input className={inputCls} style={inputStyle} value={editForm.url} onChange={(event) => setEditForm({ ...editForm, url: event.target.value })} />
            {book.libraryType === "paper" && <label className="flex items-center gap-2 text-xs" style={{ color: COLORS.subtle }}><input type="checkbox" checked={editForm.studentDownloadEnabled} onChange={(event) => setEditForm({ ...editForm, studentDownloadEnabled: event.target.checked })} /> السماح للطالب بالتنزيل</label>}
            <button type="button" onClick={() => { onUpdate(book.id, { title: editForm.title, url: editForm.url, category: editForm.category, student_download_enabled: editForm.studentDownloadEnabled }); setEditingId(null); }} className="rounded-lg px-3 py-2 text-xs font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>حفظ</button>
            <button type="button" onClick={() => setEditingId(null)} className="rounded-lg border px-3 py-2 text-xs" style={{ borderColor: COLORS.border, color: COLORS.subtle }}>إلغاء</button>
          </div>
        ) : (
          <div className="flex min-w-0 flex-1 items-center gap-2">
            {isPaper ? (studentMode && book.studentDownloadEnabled === false ? <span className="text-sm font-semibold" style={{ color: COLORS.ink }}>{book.title}</span> : book.storagePath ? <button type="button" onClick={() => downloadPaperBook(book)} className="truncate text-right text-sm font-semibold underline" style={{ color: COLORS.navy }}>{book.title}</button> : <a href={link === "#" ? undefined : link} download={studentMode ? true : undefined} target="_blank" rel="noreferrer" className="truncate text-sm font-semibold underline" style={{ color: COLORS.navy }}>{book.title}</a>) : <button type="button" onClick={() => setViewerBook(book)} className="truncate text-right text-sm font-semibold underline" style={{ color: COLORS.navy }}>{book.title}</button>}
            <span className="text-[11px]" style={{ color: COLORS.subtle }}>{isPaper ? (book.studentDownloadEnabled === false ? "التنزيل غير مسموح" : "تنزيل ورقي") : isAudio ? "استماع داخل المكتبة" : "عرض داخل المكتبة"}</span>
          </div>
        )}
        {editable && editingId !== book.id && (
          <div className="flex items-center gap-2">
            <button type="button" onClick={() => beginEdit(book)} className="text-xs font-semibold" style={{ color: COLORS.navy }}>تعديل</button>
            <button type="button" onClick={() => onUpdate(book.id, { visible: book.visible === false })} className="text-xs" style={{ color: book.visible === false ? "#1E7A38" : COLORS.goldDark }}>{book.visible === false ? "إظهار" : "إخفاء"}</button>
            <button type="button" onClick={() => onDelete(book.id)} className="text-xs" style={{ color: COLORS.red }}>حذف</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <InfoCard labelAr="المكتبة الورقية والرقمية" labelDe="Papier- und Digitalbibliothek">
      <div className="mb-4 flex flex-col gap-2 sm:flex-row">
        <select className={inputCls} style={inputStyle} value={level} onChange={(event) => setLevel(event.target.value)}>{LEVELS.map((item) => <option key={item} value={item}>{item}</option>)}</select>
        <button type="button" onClick={() => setLibraryType("paper")} className="rounded-lg px-3 py-2 text-sm font-semibold" style={{ backgroundColor: libraryType === "paper" ? COLORS.navy : "#F7F9FB", color: libraryType === "paper" ? "#fff" : COLORS.ink }}>ورقي</button>
        <button type="button" onClick={() => setLibraryType("digital")} className="rounded-lg px-3 py-2 text-sm font-semibold" style={{ backgroundColor: libraryType === "digital" ? COLORS.red : "#F7F9FB", color: libraryType === "digital" ? "#fff" : COLORS.ink }}>رقمي</button>
      </div>
      {message && <p className="mb-3 rounded-lg px-3 py-2 text-xs" style={{ backgroundColor: message.includes("بنجاح") ? "#EAF6EC" : "#FBE7E9", color: message.includes("بنجاح") ? "#1E7A38" : COLORS.red }}>{message}</p>}
      {editable && <form onSubmit={submit} className="mb-4 grid grid-cols-1 gap-2 sm:grid-cols-3">
        <select className={inputCls} style={inputStyle} value={form.category} onChange={(event) => setForm({ ...form, category: event.target.value })}>{dictionariesOnly ? <option value="dictionary">قاموس</option> : LIBRARY_CATEGORIES.map((category) => <option key={category.value} value={category.value}>{category.label}</option>)}</select>
        <input required className={inputCls} style={inputStyle} placeholder="اسم الكتاب أو الملف" value={form.title} onChange={(event) => setForm({ ...form, title: event.target.value })} />
        <input type="url" className={inputCls} style={inputStyle} placeholder="رابط خارجي اختياري" value={form.url} onChange={(event) => setForm({ ...form, url: event.target.value })} />
        <label className="flex cursor-pointer items-center justify-center rounded-lg border px-3 py-2 text-sm sm:col-span-3" style={{ borderColor: COLORS.border, color: COLORS.navy }}><input type="file" accept=".pdf,.epub,.html,.mp3,.wav,.m4a,.mp4,image/*" className="hidden" onChange={(event) => setForm({ ...form, file: event.target.files?.[0] || null })} />{form.file ? `تم اختيار: ${form.file.name}` : "رفع ملف من الجهاز"}</label>
        <button type="submit" className="rounded-lg px-4 py-2 text-sm font-semibold sm:col-span-3" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>إضافة المادة</button>
      </form>}
      {bundledCourses.length > 0 && <div className="mb-4 grid grid-cols-1 gap-2 md:grid-cols-2">{bundledCourses.map((course) => <button key={course.url} type="button" onClick={() => setViewerBook({ ...course, libraryType: "digital" })} className="rounded-lg border p-3 text-right" style={{ borderColor: COLORS.border, color: COLORS.navy }}><span className="block text-sm font-semibold">{course.title}</span><span className="mt-1 block text-xs" style={{ color: COLORS.subtle }}>{course.description}</span></button>)}</div>}
      <div className="space-y-2">{displayBooks.length ? displayBooks.map(renderBook) : <p className="text-sm" style={{ color: COLORS.subtle }}>لا توجد مواد مضافة لهذا المستوى بعد.</p>}</div>
      {viewerBook && <LibraryFileViewer book={viewerBook} onClose={() => setViewerBook(null)} />}
    </InfoCard>
  );
}

function InstructorHomePage({ instructor, students, attendance }) {
  const presentCount = attendance.filter((record) => record.status === "present").length;
  const lateCount = attendance.filter((record) => record.status === "late").length;
  const absentCount = attendance.filter((record) => record.status === "absent").length;
  const profileItems = [

function downloadAttendanceReport(students, attendance, student) {
  const rows = student ? students.filter((item) => item.profileId === student.profileId) : students;
  const targetRecords = student ? attendance.filter((record) => record.studentProfileId === student.profileId) : attendance;
  const escapeCsv = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const lines = [["الطالب", "الكود", "المستوى", "الحضور", "الغياب", "التأخير", "التاريخ", "الوقت", "الحالة", "ملاحظات"]];
  rows.forEach((item) => {
    const records = targetRecords.filter((record) => record.studentProfileId === item.profileId);
    const totals = { present: 0, absent: 0, late: 0 };
    records.forEach((record) => { totals[record.status] = (totals[record.status] || 0) + 1; });
    if (!records.length) lines.push([item.name, item.id, item.level, totals.present, totals.absent, totals.late, "", "", "", ""]);
    records.forEach((record, index) => lines.push([item.name, item.id, item.level, index === 0 ? totals.present : "", index === 0 ? totals.absent : "", index === 0 ? totals.late : "", record.sessionDate, record.sessionTime, attendanceLabel(record.status), record.notes]));
  });
  const blob = new Blob(["\ufeff" + lines.map((line) => line.map(escapeCsv).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = student ? `attendance-${student.id}.csv` : "attendance-all-students.csv";
  link.click();
  URL.revokeObjectURL(link.href);
}

function downloadStudyReport(students, studySessions) {
  const escapeCsv = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const lines = [["Student", "Code", "Start", "Ende", "Status", "Lernminuten", "Pause (Minuten)"]];
  (studySessions || []).forEach((session) => {
    const student = (students || []).find((item) => item.profileId === session.studentProfileId);
    const stats = calculateStudyStats(session);
    lines.push([student?.name || session.studentProfileId, student?.id || "", session.startedAt, session.endedAt || "", session.status, stats.studyMinutes, stats.breakMinutes]);
  });
  const blob = new Blob(["\ufeff" + lines.map((line) => line.map(escapeCsv).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "student-study-report.csv";
  link.click();
  URL.revokeObjectURL(link.href);
}

reakMinutes} د</span></div>; })}</div>}</div>; })}</div>}

function NewRequestForm({ studentName, studentCode, requests, onSubmit, onDelete }) {
  const [requestType, setRequestType] = useState("");
  const [details, setDetails] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("");
  const [paymentAmount, setPaymentAmount] = useState("");
  const [absenceDate, setAbsenceDate] = useState("");
  const [absenceDuration, setAbsenceDuration] = useState("");
  const [transferName, setTransferName] = useState("");
  const [transferPhone, setTransferPhone] = useState("");
  const [receipt, setReceipt] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [message, setMessage] = useState("");

  function resetForm() {
    setRequestType(""); setDetails(""); setPaymentMethod(""); setPaymentAmount("");
    setAbsenceDate(""); setAbsenceDuration(""); setTransferName(""); setTransferPhone(""); setReceipt("");
    saveLS("studentTransferReceipt", "");
  }
  function readReceipt(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { setMessage("حجم الإيصال يجب ألا يتجاوز 4 ميجابايت."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      setReceipt(dataUrl);
      saveLS("studentTransferReceipt", dataUrl);
    };
    reader.readAsDataURL(file);
  }

  React.useEffect(() => {
    const storedReceipt = loadLS("studentTransferReceipt", "");
    if (storedReceipt) setReceipt(storedReceipt);
  }, []);

  React.useEffect(() => {
    if (requestType === "payment") {
      saveLS("studentTransferReceipt", receipt);
    }
  }, [receipt, requestType]);

  async function submit(event) {
    event.preventDefault();
    setMessage("");
    if (!requestType) return setMessage("من فضلك اختر نوع الطلب أولاً.");
    if (!details.trim()) return setMessage("من فضلك اكتب تفاصيل أو تعليق الطلب.");
    if (requestType === "payment" && (!paymentMethod || !paymentAmount || Number(paymentAmount) <= 0)) return setMessage("من فضلك اختر طريقة الدفع وأدخل المبلغ.");
    if ((requestType === "absence" || requestType === "late") && !absenceDate) return setMessage("من فضلك اختر تاريخ الحصة.");
    if (requestType === "refund" && (!transferName.trim() || !transferPhone.trim())) return setMessage("من فضلك أدخل اسم ورقم هاتف مستلم التحويل.");
    const transferInfo = requestType === "refund" ? `اسم مستلم التحويل: ${transferName.trim()}\nرقم الهاتف: ${transferPhone.trim()}` : "";
    const requestDetails = (requestType === "absence" || requestType === "late") ? `${details.trim()}\nتاريخ الحصة: ${absenceDate}\nالمدة: ${absenceDuration || "غير محددة"}` : details.trim();
    const result = await onSubmit({ requestType, details: requestDetails, paymentMethod, paymentAmount, transferInfo, receipt, studentName, studentCode });
    if (result && result !== "تم إرسال الطلب بنجاح.") { setMessage(result); return; }
    if (requestType === "refund") setSubmitted(true);
    else { resetForm(); setMessage("تم إرسال طلبك بنجاح."); }
  }

  if (submitted) return <div className="rounded-2xl border p-5 mb-5" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}><div className="rounded-xl p-4" style={{ backgroundColor: "#f0fdf4", border: "1px solid #86efac" }}><p className="text-sm font-semibold" style={{ color: "#166534" }}>تم استلام طلب الاسترداد بنجاح</p><p className="text-xs mt-1" style={{ color: "#166534" }}>قد تستغرق معالجة الطلب من 30 إلى 45 يوماً من تاريخ التقديم.</p></div><button type="button" onClick={() => { setSubmitted(false); resetForm(); }} className="mt-4 text-xs underline" style={{ color: COLORS.navy }}>تقديم طلب آخر</button></div>;

  return <div className="rounded-2xl border p-5 mb-5" style={{ borderColor: COLORS.border, backgroundColor: COLORS.panel }}>
    <h2 className="text-base font-semibold mb-4" style={{ color: COLORS.ink, fontFamily: F_DISPLAY }}>تقديم طلب جديد — Neue Anfrage</h2>
    <form onSubmit={submit} className="space-y-3">
      <select required className={inputCls} style={inputStyle} value={requestType} onChange={(e) => setRequestType(e.target.value)}><option value="">اختر نوع الطلب — Anfrageart wählen</option>{REQUEST_TYPES.filter((type) => type.value !== "library_payment").map((type) => <option key={type.value} value={type.value}>{type.label}</option>)}</select>
      {requestType === "payment" && <div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><select required className={inputCls} style={inputStyle} value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}><option value="">طريقة الدفع — Zahlungsart</option>{Object.entries(PAYMENT_METHOD_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select><input required type="number" min="0.01" step="0.01" className={inputCls} style={inputStyle} value={paymentAmount} onChange={(e) => setPaymentAmount(e.target.value)} placeholder="المبلغ — Betrag" /></div>}
      {(requestType === "absence" || requestType === "late") && <div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><label className="text-xs" style={{ color: COLORS.subtle }}>تاريخ الحصة<input required type="date" className={`${inputCls} mt-1`} style={inputStyle} value={absenceDate} onChange={(e) => setAbsenceDate(e.target.value)} /></label><label className="text-xs" style={{ color: COLORS.subtle }}>{requestType === "absence" ? "مدة الغياب" : "مدة التأخير"}<input className={`${inputCls} mt-1`} style={inputStyle} value={absenceDuration} onChange={(e) => setAbsenceDuration(e.target.value)} placeholder={requestType === "absence" ? "مثال: يوم كامل" : "مثال: 15 دقيقة"} /></label></div>}
      {requestType === "refund" && <div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><input required className={inputCls} style={inputStyle} value={transferName} onChange={(e) => setTransferName(e.target.value)} placeholder="اسم مستلم التحويل" /><input required className={inputCls} style={inputStyle} value={transferPhone} onChange={(e) => setTransferPhone(e.target.value)} placeholder="رقم هاتف مستلم التحويل" /></div>}
      {requestType === "payment" && <label className="flex items-center gap-2 border rounded-lg px-3 py-2 text-xs cursor-pointer" style={{ borderColor: COLORS.border, color: COLORS.subtle }}><input type="file" accept="image/*" className="hidden" onChange={readReceipt} />{receipt ? "تم إرفاق صورة الإيصال" : "رفع صورة إيصال الدفع / Screenshot"}</label>}
      <textarea required className={inputCls} style={inputStyle} rows="3" value={details} onChange={(e) => setDetails(e.target.value)} placeholder="اكتب تفاصيل الطلب أو تعليقك هنا" />
      {message && <p className="text-xs" style={{ color: message.includes("بنجاح") ? "#1E7A38" : COLORS.red }}>{message}</p>}
      <button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ backgroundColor: COLORS.navy, color: "#fff" }}>إرسال الطلب</button>
    </form>
    {requests.length > 0 && <div className="flex flex-wrap gap-2 mt-3">{requests.map((request) => <button key={`delete-${request.id}`} type="button" onClick={() => { if (window.confirm("هل تريد حذف هذا الطلب نهائياً؟")) onDelete(request.id); }} className="px-2 py-1 rounded-lg text-xs" style={{ color: COLORS.red, border: `1px solid ${COLORS.red}` }}>حذف الطلب {request.reference_code || ""}</button>)}</div>}
    <div className="mt-5 space-y-2"><h3 className="text-sm font-semibold" style={{ color: COLORS.ink }}>الطلبات السابقة — Frühere Anfragen</h3>{requests.length === 0 ? <p className="text-xs" style={{ color: COLORS.subtle }}>لا توجد طلبات سابقة.</p> : requests.map((request) => <div key={request.id} className="border-t pt-2" style={{ borderColor: COLORS.border }}><div className="flex justify-between gap-2 text-xs"><strong>{REQUEST_TYPES.find((type) => type.value === request.request_type)?.label || request.request_type}</strong><span>{REQUEST_STATUS_LABELS[request.status] || "قيد الانتظار — Ausstehend"} · {request.reference_code || `REF_${studentCode}`}</span></div><p className="text-xs mt-1 whitespace-pre-line" style={{ color: COLORS.subtle }}>{request.details}</p>{request.admin_note && <p className="text-xs mt-2" style={{ color: COLORS.subtle }}>تعليق الأكاديمية — Kommentar: {request.admin_note}</p>}{request.request_type === "payment" && <p className="text-xs mt-1" style={{ color: COLORS.subtle }}>طريقة الدفع: {PAYMENT_METHOD_LABELS[request.payment_method] || "—"} · المبلغ: {request.payment_amount || "—"}</p>}{request.request_type === "refund" && <p className="text-xs mt-1 whitespace-pre-line" style={{ color: COLORS.subtle }}>حالة السداد — Zahlungsstatus: {request.payment_status === "paid" ? "مسدد — Bezahlt" : "معلق — Ausstehend"}{request.transfer_info ? `\nبيانات التحويل — Überweisungsdaten: ${request.transfer_info}` : ""}{request.payment_date ? `\nتاريخ السداد — Zahlungsdatum: ${request.payment_date}` : ""}{request.receipt ? "\nإيصال التحويل مرفق — Beleg beigefügt" : ""}</p>}</div>)}</div>
