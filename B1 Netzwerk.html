<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapitel 1: Gute Reise! – DOS Deutschkurs B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18181a;
    --ink-soft:#3a382f;
    --paper:#f7f4ec;
    --paper-deep:#eee7d6;
    --card:#fffdf7;
    --line:#ddd4bd;
    --red:#c22a2f;
    --red-deep:#9c1f24;
    --gold:#e0a52c;
    --gold-deep:#b9821c;
    --muted:#79735f;
    --success:#3c7a52;
    --success-bg:#e7f1ea;
    --error:#b3272c;
    --error-bg:#faeceb;
    --radius:4px;
    --shadow: 0 1px 2px rgba(24,24,26,.06), 0 8px 24px -12px rgba(24,24,26,.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
  }
  h1,h2,h3,.display{
    font-family:'Source Serif 4', serif;
    color:var(--ink);
    margin:0 0 .4em 0;
    font-weight:600;
  }
  .brandbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 24px;
    background:var(--ink);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,var(--red) 0 50%, var(--gold) 50% 100%) 1;
  }
  .brandbar img{height:40px;display:block;border-radius:2px;background:#fff;padding:3px 6px;}
  .brandbar .titles{color:#f4f0e4;}
  .brandbar .titles .course{font-family:'Source Serif 4',serif;font-size:1.15rem;font-weight:600;line-height:1.2;}
  .brandbar .titles .tag{font-size:.78rem;color:#c9c3ae;letter-spacing:.02em;}
  .layout{
    display:grid;
    grid-template-columns:240px 1fr;
    max-width:1180px;
    margin:0 auto;
    min-height:calc(100vh - 68px);
  }
  nav.toc{
    border-right:1px solid var(--line);
    padding:18px 10px 40px;
    background:var(--paper-deep);
  }
  nav.toc .toc-heading{
    font-size:.72rem;
    color:var(--muted);
    padding:4px 12px 10px;
    letter-spacing:.03em;
  }
  .toc-item{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 12px;
    border-radius:var(--radius);
    cursor:default;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:2px;
  }
  .toc-item .num{
    font-family:'Source Serif 4',serif;
    font-size:.95rem;
    color:var(--muted);
    min-width:1.4em;
  }
  .toc-item .label{font-size:.87rem;}
  .toc-item.active{
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .toc-item.active .num{color:var(--red);font-weight:600;}
  .toc-item.active .label{color:var(--ink);font-weight:600;}
  .toc-item.locked{opacity:.48;}
  .toc-item.locked .label::after{content:" · bald";font-size:.72rem;color:var(--muted);}
  .toc-exam{
    margin:10px 6px 14px;
    padding:8px 12px;
    font-size:.78rem;
    color:var(--gold-deep);
    background:#fbf1dd;
    border-radius:var(--radius);
    border:1px dashed var(--gold);
  }
  main{padding:28px 32px 80px;}
  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }
  .chapter-head .kicker{
    font-family:'Source Serif 4',serif;
    font-size:2.2rem;
    color:var(--red);
    line-height:1;
  }
  .chapter-head h1{font-size:1.7rem;}
  .chapter-sub{color:var(--muted);margin-bottom:22px;font-size:.94rem;}
  .tabs{
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .tab-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:.86rem;
    font-weight:600;
    padding:10px 16px;
    background:none;
    border:none;
    border-bottom:3px solid transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--red);}
  .panel{display:none;}
  .panel.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 26px;
    margin-bottom:20px;
  }
  .card h2{font-size:1.15rem;border-bottom:2px solid var(--paper-deep);padding-bottom:8px;margin-bottom:14px;}
  .lernziele-list{margin:0;padding-left:0;list-style:none;}
  .lernziele-list li{
    padding:7px 0 7px 26px;
    position:relative;
    border-bottom:1px solid var(--paper-deep);
    font-size:.95rem;
  }
  .lernziele-list li:last-child{border-bottom:none;}
  .lernziele-list li::before{
    content:"";
    position:absolute;left:2px;top:15px;
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
  }
  .uebersicht-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:720px){.uebersicht-grid{grid-template-columns:1fr;}}
  .media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px;}
  .media-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .media-label{font-size:.78rem;font-weight:700;letter-spacing:.03em;color:var(--red-deep);margin-bottom:8px;text-transform:uppercase;}
  .media-card audio, .media-card video{width:100%;max-width:100%;display:block;border-radius:6px;background:#111;}
  .media-card video{min-height:180px;object-fit:cover;}
  .bank-list{display:grid;gap:12px;}
  .bank-question{padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
  .bank-question .qtext{font-weight:600;margin-bottom:8px;}
  .bank-question .opts{display:grid;gap:6px;}
  .bank-question label{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-deep);}
  .ov-block dt{font-family:'Source Serif 4',serif;font-weight:600;color:var(--red-deep);font-size:.92rem;margin-bottom:4px;}
  .ov-block dd{margin:0 0 14px 0;font-size:.9rem;color:var(--ink-soft);}
  .grammar-block{margin-bottom:8px;}
  .grammar-block h3{
    font-size:1.05rem;
    display:flex;align-items:center;gap:10px;
  }
  .grammar-block h3 .tag-num{
    font-family:'Source Serif 4',serif;
    color:#fff;background:var(--red);
    width:26px;height:26px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:.85rem;flex-shrink:0;
  }
  .rule-box{
    background:var(--paper-deep);
    border-left:3px solid var(--gold);
    padding:12px 16px;
    border-radius:0 var(--radius) var(--radius) 0;
    margin:12px 0;
    font-size:.92rem;
  }
  .example{
    padding:8px 10px;
    border-bottom:1px solid var(--paper-deep);
  }
  .example:last-child{border-bottom:none;}
  .example-main{display:flex;align-items:center;gap:10px;}
  .example .txt{font-size:.94rem;flex:1;}
  .example .txt b{color:var(--red-deep);}
  .toc-item{cursor:pointer;}
  .speak-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:.85rem;
    transition:background .15s, color .15s;
  }
  .speak-btn:hover{background:var(--red);color:#fff;border-color:var(--red);}
  .speak-btn.playing{background:var(--gold);color:#fff;border-color:var(--gold);}
  .audio-controls{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    background:var(--paper-deep);
    padding:12px 16px;
    border-radius:var(--radius);
    margin-bottom:18px;
  }
  .audio-controls button{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:.85rem;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .audio-controls button.secondary{background:transparent;color:var(--ink);}
  .audio-controls select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:.82rem;
    padding:6px 8px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:#fff;
  }
  .audio-controls label{font-size:.8rem;color:var(--muted);}
  .audio-controls input[type="range"]{vertical-align:middle;}
  .audio-note{font-size:.78rem;color:var(--muted);margin:-8px 0 18px;}
  .lang-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--paper-deep);
    padding:12px 16px;border-radius:var(--radius);
    margin-bottom:18px;
  }
  .lang-bar label{font-size:.85rem;color:var(--ink-soft);font-weight:600;}
  .lang-bar select{
    font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;
    padding:7px 10px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;
  }
  .translator-box{
    display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;
    margin-bottom:22px;
  }
  .translator-box textarea{
    flex:1;min-width:220px;
    font-family:'IBM Plex Sans',sans-serif;font-size:.92rem;
    padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    resize:vertical;min-height:44px;background:#fff;
  }
  .translator-box button{
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:.85rem;
    padding:10px 18px;border-radius:20px;border:none;background:var(--gold-deep);color:#fff;cursor:pointer;
    white-space:nowrap;
  }
  .translator-result{
    width:100%;
    background:#fff;border:1px dashed var(--gold);border-radius:var(--radius);
    padding:10px 14px;font-size:.9rem;color:var(--ink-soft);display:none;
  }
  .wortschatz-sub{
    font-family:'Source Serif 4',serif;font-size:1rem;color:var(--red-deep);
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--paper-deep);
  }
  .wortschatz-sub:first-of-type{margin-top:4px;}
  .vocab-item{border-bottom:1px solid var(--paper-deep);padding:10px 0;}
  .vocab-item:last-child{border-bottom:none;}
  .vocab-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .vocab-text{flex:1;min-width:180px;}
  .vocab-text .de{font-size:.96rem;font-weight:600;color:var(--ink);}
  .vocab-text .de .pos{font-weight:400;color:var(--muted);font-size:.8rem;}
  .vocab-text .example{font-size:.87rem;color:var(--ink-soft);margin-top:2px;}
  .translate-btn{
    border:1px solid var(--gold-deep);background:#fff;color:var(--gold-deep);
    font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:16px;cursor:pointer;
    display:flex;align-items:center;gap:5px;flex-shrink:0;
  }
  .translate-btn:hover{background:var(--gold-deep);color:#fff;}
  .translation-result{
    display:none;margin:8px 0 0 40px;font-size:.87rem;color:var(--red-deep);
    background:#fbf1dd;padding:6px 12px;border-radius:var(--radius);
  }
  .exam-passage{font-size:1rem;line-height:1.7;background:var(--paper-deep);padding:16px 20px;border-radius:var(--radius);margin-bottom:18px;}
  .exam-passage p{margin:0 0 10px 0;}
  .redemittel-list{list-style:none;margin:8px 0 0;padding:0;}
  .redemittel-list li{
    display:inline-block;background:#fff;border:1px solid var(--gold);color:var(--gold-deep);
    font-size:.82rem;padding:5px 12px;border-radius:16px;margin:3px 6px 3px 0;
  }
  .sprechen-card{border-bottom:1px solid var(--paper-deep);padding:14px 0;}
  .sprechen-card:last-child{border-bottom:none;}
  .sprechen-card .stitle{font-family:'Source Serif 4',serif;font-size:1rem;color:var(--red-deep);margin-bottom:6px;}
  .sprechen-card.approved{background:var(--success-bg);border-radius:var(--radius);padding:14px 12px;}
  .rec-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .rec-controls button{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:.82rem;
    padding:7px 14px;border-radius:16px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  }
  .rec-controls button.secondary{background:#fff;color:var(--ink);}
  .rec-controls button:disabled{opacity:.45;cursor:not-allowed;}
  .rec-controls button.approve-btn{background:var(--success);border-color:var(--success);}
  .rec-controls button.download-btn{background:var(--gold-deep);border-color:var(--gold-deep);}
  .rec-status{font-size:.82rem;color:var(--muted);margin-top:6px;min-height:1.2em;}
  .rec-audio{display:none;width:100%;max-width:360px;margin-top:8px;}
  .rec-progress{font-size:.85rem;font-weight:600;color:var(--red-deep);margin-bottom:14px;}
  .writing-area{width:100%;min-height:220px;font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;
    padding:14px;border:1px solid var(--line);border-radius:var(--radius);resize:vertical;background:#fff;}
  .word-counter{font-size:.8rem;color:var(--muted);margin-top:6px;}
  .tips-list{margin:0 0 16px;padding-left:20px;font-size:.9rem;color:var(--ink-soft);}
  .tips-list li{margin-bottom:6px;}
  .exam-note{font-size:.82rem;color:var(--muted);background:var(--paper-deep);padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;}

  /* Dialog (Finn & Emma) */
  .dialog-box{display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-top:6px;}
  .dialog-line{
    max-width:78%;margin:5px 0;padding:9px 15px;border-radius:16px;font-size:.92rem;line-height:1.45;
  }
  .dline-m{background:var(--paper-deep);margin-right:auto;border-bottom-left-radius:4px;}
  .dline-f{background:#fbe9d0;margin-left:auto;border-bottom-right-radius:4px;text-align:right;}
  .dialog-line.active-satz{box-shadow:0 0 0 2px var(--gold);}
  .speaker-name{font-weight:700;color:var(--red-deep);margin-inline-end:6px;}
  .dline-f .speaker-name{color:var(--gold-deep);}
  .play-trigger-btn{
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:.88rem;
    padding:10px 20px;border-radius:22px;border:none;background:var(--ink);color:#fff;cursor:pointer;
    margin-bottom:16px;
  }
  .play-trigger-btn:hover{background:var(--red-deep);}

  /* Compact audio controls in header */
  .brandbar{position:sticky;top:0;z-index:600;flex-wrap:wrap;}
  .audio-mini{
    margin-left:auto;display:flex;align-items:center;gap:5px;position:relative;flex-shrink:0;
  }
  .audio-mini button{
    width:24px;height:24px;border-radius:50%;border:none;background:var(--red);color:#fff;
    font-size:.62rem;cursor:pointer;flex-shrink:0;line-height:1;padding:0;
  }
  .audio-mini button:hover{background:var(--red-deep);}
  #gab-settings-toggle{
    background:transparent;border:1px solid #756f5d;color:#d8d3c2;font-size:.7rem;
  }
  #gab-settings-toggle:hover{background:rgba(255,255,255,.08);}
  .gab-label-mini{
    font-size:.66rem;color:#c9c3ae;max-width:150px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;display:none;
  }
  @media(min-width:880px){ .gab-label-mini{display:inline-block;} }
  .gab-settings-panel{
    position:absolute;top:32px;right:0;z-index:610;
    background:#fffdf7;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow);padding:12px 14px;width:250px;
    display:flex;flex-direction:column;gap:9px;font-size:.78rem;
  }
  .gab-settings-panel.hidden{display:none;}
  .gab-settings-panel label{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .gab-settings-panel select{font-size:.74rem;padding:3px 6px;border-radius:4px;border:1px solid var(--line);flex:1;min-width:0;}
  .gab-settings-panel .prevrow{display:flex;align-items:center;gap:6px;}
  .gab-settings-panel button.secondary{
    background:var(--paper-deep);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:3px 9px;font-size:.7rem;cursor:pointer;flex-shrink:0;
  }
  .gab-settings-panel input[type="range"]{flex:1;}

  .dialect-toggle-wrap{position:relative;display:flex;align-items:center;gap:8px;margin-left:12px;}
  .dialect-toggle{
    width:28px;height:28px;border-radius:50%;border:1px solid #d5c9a9;background:#fffdf7;
    color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;
    box-shadow:var(--shadow);padding:0;
  }
  .dialect-toggle:hover{background:var(--paper-deep);}
  .dialect-pill{
    display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
    padding:4px 10px;background:var(--paper-deep);border:1px solid var(--line);color:var(--ink-soft);
    font-size:.72rem;font-weight:600;letter-spacing:.02em;
  }
  .dialect-panel{
    position:absolute;top:34px;right:0;z-index:620;background:#fffdf7;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;
    display:flex;flex-direction:column;gap:8px;width:170px;
  }
  .dialect-panel.hidden{display:none;}
  .dialect-option{
    width:100%;text-align:left;border:none;background:transparent;padding:7px 8px;border-radius:6px;
    cursor:pointer;font-size:.75rem;color:var(--ink-soft);
  }
  .dialect-option.active{background:var(--paper-deep);color:var(--ink);font-weight:600;}
  .dialect-option:hover{background:var(--paper-deep);}

  .quick-write-wrap{position:relative;display:flex;align-items:center;gap:8px;margin-left:12px;}
  .quick-write-toggle{
    width:28px;height:28px;border-radius:50%;border:1px solid #d5c9a9;background:#fffdf7;
    color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;
    box-shadow:var(--shadow);padding:0;
  }
  .quick-write-toggle:hover{background:var(--paper-deep);}
  .quick-write-panel{
    position:absolute;top:34px;right:0;z-index:620;background:#fffdf7;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;
    display:flex;flex-direction:column;gap:8px;width:240px;
  }
  .quick-write-panel.hidden{display:none;}
  .quick-write-panel textarea{
    width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    resize:vertical;font:inherit;background:#fff;
  }
  .quick-write-actions{display:flex;justify-content:space-between;gap:8px;}
  .quick-write-actions button{
    flex:1;border:none;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:.72rem;font-weight:600;
  }
  .quick-write-actions .save-btn{background:var(--red);color:#fff;}
  .quick-write-actions .clear-btn{background:var(--paper-deep);color:var(--ink);border:1px solid var(--line);}

  /* Celebration effects */
  .confetti-piece{
    position:fixed;top:-20px;width:8px;height:14px;z-index:9999;opacity:.92;
    animation-name:confetti-fall;animation-timing-function:linear;animation-fill-mode:forwards;
    pointer-events:none;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(112vh) rotate(360deg); opacity:.25; }
  }
  .balloon-piece{
    position:fixed;bottom:-40px;z-index:9999;pointer-events:none;
    animation-name:balloon-rise;animation-timing-function:ease-in;animation-fill-mode:forwards;
  }
  @keyframes balloon-rise{
    to{ transform:translateY(-112vh); opacity:0; }
  }
  .lesetext{font-size:1.02rem;}
  .lesetext p{margin:0 0 14px 0;}
  .satz{padding:1px 2px;border-radius:3px;}
  .satz.active-satz{background:#fbe6b9;box-shadow:0 0 0 1px var(--gold);}
  .q-block{margin-bottom:26px;}
  .q-block .q-teil{
    font-size:.78rem;
    text-transform:none;
    color:var(--muted);
    font-weight:600;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--paper-deep);
  }
  .question{
    padding:12px 4px;
    border-bottom:1px solid var(--paper-deep);
  }
  .question p.qtext{margin:0 0 10px 0;font-size:.95rem;}
  .question .opts{display:flex;flex-direction:column;gap:6px;}
  .question label{
    display:flex;align-items:center;gap:8px;
    font-size:.9rem;
    padding:6px 10px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    cursor:pointer;

function applyDialectUI(){

function ensureListLength(list, min, fill) {
  if(!Array.isArray(list)) return [];
  const result = [...list];
  let i = 0;
  while(result.length < min){
    const next = fill[i % fill.length];
    if(next && !result.includes(next)) result.push(next);
    else if(next) result.push(next);
    i++;
    if(i > fill.length * 10) break;
  }
  return result;
}

        "title": "Verb lassen",
        "body": "<p>Das Verb <b>lassen</b> hat zwei wichtige Bedeutungen. Erstens: etwas nicht selbst tun, sondern von jemand anderem machen lassen (kausativ). Zweitens: <b>lassen</b> = erlauben. In beiden Fällen steht danach ein Infinitiv <b>ohne zu</b>. Im Perfekt benutzt man statt „gelassen“ den Ersatzinfinitiv: <i>hat â€¦ lassen</i>.</p>\n<div class=\"rule-box\">Kausativ: Ich <b>lasse</b> mein Handy <b>reparieren</b>. (= Ich repariere es nicht selbst, ein Techniker macht es.)<br>Erlauben: Meine Eltern <b>lassen</b> mich lange <b>aufbleiben</b>.<br>Perfekt: Er <b>hat</b> sein Auto waschen <b>lassen</b>. (nicht: hat â€¦ gelassen)</div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Ich lasse mein Handy im Repair Cafe reparieren.\">▶</button>\n        <span class=\"txt\">Ich <b>lasse</b> mein Handy im Repair Café <b>reparieren</b>.</span>\n        <button class=\"translate-btn\" data-text=\"Ich lasse mein Handy im Repair Cafe reparieren.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Er hat sein Auto waschen lassen.\">▶</button>\n        <span class=\"txt\">Er hat sein Auto waschen <b>lassen</b>.</span>\n        <button class=\"translate-btn\" data-text=\"Er hat sein Auto waschen lassen.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Meine Eltern lassen mich am Wochenende lange aufbleiben.\">▶</button>\n        <span class=\"txt\">Meine Eltern <b>lassen</b> mich am Wochenende lange <b>aufbleiben</b>.</span>\n        <button class=\"translate-btn\" data-text=\"Meine Eltern lassen mich am Wochenende lange aufbleiben.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>"

        "title": "Folgen ausdrücken: deshalb/deswegen/darum/daher, sodass / so ... dass",
        "body": "<p>Um eine <b>Folge</b> (ein Ergebnis) auszudrücken, gibt es zwei Möglichkeiten. 1) Die Adverbien <b>deshalb, deswegen, darum, daher</b> stehen am Anfang eines neuen Hauptsatzes (Verb-Zweit-Satz) und verbinden zwei gleichwertige Sätze. 2) Die Konjunktion <b>sodass</b> sowie die Konstruktion <b>so â€¦ dass</b> leiten einen Nebensatz ein — das Verb steht dabei am Ende.</p>\n<div class=\"rule-box\">Hauptsatz. <b>Deshalb</b>/<b>Deswegen</b>/<b>Darum</b>/<b>Daher</b> + Verb + Subjekt â€¦<br>Hauptsatz, <b>sodass</b> + Subjekt â€¦ + Verb (Ende).<br>Er war <b>so</b> müde, <b>dass</b> er sofort einschlief.</div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Der Bildschirm war kaputt. Deshalb habe ich reklamiert.\">▶</button>\n        <span class=\"txt\">Der Bildschirm war kaputt. <b>Deshalb</b> habe ich reklamiert.</span>\n        <button class=\"translate-btn\" data-text=\"Der Bildschirm war kaputt. Deshalb habe ich reklamiert.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Wir haben das Kabel repariert, sodass der Toaster wieder funktionierte.\">▶</button>\n        <span class=\"txt\">Wir haben das Kabel repariert, <b>sodass</b> der Toaster wieder funktionierte.</span>\n        <button class=\"translate-btn\" data-text=\"Wir haben das Kabel repariert, sodass der Toaster wieder funktionierte.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Ich war so zufrieden, dass ich einen positiven Kommentar geschrieben habe.\">▶</button>\n        <span class=\"txt\">Ich war <b>so</b> zufrieden, <b>dass</b> ich einen positiven Kommentar geschrieben habe.</span>\n        <button class=\"translate-btn\" data-text=\"Ich war so zufrieden, dass ich einen positiven Kommentar geschrieben habe.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>"

        "title": "Genitiv",
        "body": "<p>Der <b>Genitiv</b> zeigt Besitz oder Zugehörigkeit („wessen?“). Maskulin und Neutrum bekommen im Genitiv den Artikel <b>des</b> und das Nomen meist die Endung <b>-(e)s</b>. Feminin und Plural bekommen den Artikel <b>der</b>, das Nomen bleibt meist unverändert. In der gesprochenen Sprache ersetzt man den Genitiv oft durch <i>von</i> + Dativ.</p>\n<div class=\"rule-box\">der Mann â†’ des Mann<b>es</b> &nbsp;·&nbsp; das Kind â†’ des Kind<b>es</b> &nbsp;·&nbsp; die Frau â†’ der Frau &nbsp;·&nbsp; die Leute â†’ der Leute<br>der Preis <b>des Handys</b> = der Preis <b>von dem Handy</b> (gesprochen)</div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Der Preis des Handys war sehr niedrig.\">▶</button>\n        <span class=\"txt\">Der Preis <b>des Handys</b> war sehr niedrig.</span>\n        <button class=\"translate-btn\" data-text=\"Der Preis des Handys war sehr niedrig.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Das ist der Kommentar der Kundin.\">▶</button>\n        <span class=\"txt\">Das ist der Kommentar <b>der Kundin</b>.</span>\n        <button class=\"translate-btn\" data-text=\"Das ist der Kommentar der Kundin.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>\n<div class=\"example\">\n      <div class=\"example-main\">\n        <button class=\"speak-btn\" data-text=\"Der Bildschirm des Geraets funktioniert jetzt wieder.\">▶</button>\n        <span class=\"txt\">Der Bildschirm <b>des Geräts</b> funktioniert jetzt wieder.</span>\n        <button class=\"translate-btn\" data-text=\"Der Bildschirm des Geraets funktioniert jetzt wieder.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>"

        "title": "Präpositionen wegen und trotz + Genitiv",

ls nicht angerufen haette, haette ich die Chance verpasst.\">🌐</button>\n      </div>\n      <div class=\"translation-result\"></div>\n    </div>"

        {

          "text": "Nein, man muss vor allem einfach mutig sein."

        {
          "speaker": "m",

// ---------------- TOC ----------------
function renderToc(){
  const toc = document.getElementById('toc');
  let html = '<div class="toc-heading">Inhalt</div>';
  for(let i=1;i<=TOTAL_KAPITEL;i++){
    const ch = CHAPTERS.find(c=>c.num===i);
    const numStr = String(i).padStart(2,'0');
    if(ch){
      html += `<a class="toc-item" data-num="${i}"><span class="num">${numStr}</span><span class="label">${ch.title}</span></a>`;
    } else {
      html += `<a class="toc-item locked"><span class="num">${numStr}</span><span class="label">in Vorbereitung</span></a>`;
    }
    const exam = EXAMS.find(e=>e.afterKapitel===i);
    if(exam){
      html += `<a class="toc-item toc-exam" data-exam="${exam.id}">📝 ${exam.title}</a>`;
    } else if(i===6 || i===12){
      html += `<div class="toc-exam">Prüfung ${i===6?'1':'2'} · nach Kapitel ${i} · in Vorbereitung</div>`;
    }
  }
  toc.innerHTML = html;
  toc.querySelectorAll('.toc-item[data-num]').forEach(item=>{
    item.addEventListener('click', ()=> showChapter(parseInt(item.dataset.num)));
  });
  toc.querySelectorAll('.toc-item[data-exam]').forEach(item=>{
    item.addEventListener('click', ()=> showExam(parseInt(item.dataset.exam)));
  });
}

function updateTocActive(kind, id){
  document.querySelectorAll('.toc-item').forEach(it=>it.classList.remove('active'));
  const sel = kind==='chapter' ? `.toc-item[data-num="${id}"]` : `.toc-item[data-exam="${id}"]`;
  const active = document.querySelector(sel);
  if(active) active.classList.add('active');
}

// ---------------- Chapter rendering ----------------
function exBtn(text){
  const s = typeof text === 'string' ? text : (text != null ? String(text) : '');
  return s.replace(/"/g,'&quot;');
}

function normalizeVocabItem(it, fallbackType='Wort'){
  if(!it) return null;
  if(typeof it === 'string') return { de: it, pos: fallbackType, ex: it };
  if(typeof it === 'object'){
    const de = it.de || it.word || it.german || it.text || it.label || '';
    const pos = it.pos || it.partOfSpeech || fallbackType;
    const ex = it.ex || it.example || it.sentence || it.use || de;
    return { de, pos, ex };
  }
  return null;
}

function renderVocabItems(items){
  const list = Array.isArray(items) ? items.map(it=>normalizeVocabItem(it)).filter(Boolean) : [];
  if(!list.length) return '<div class="vocab-item"><div class="vocab-main"><div class="vocab-text"><div class="example">Keine Einträge vorhanden.</div></div></div></div>';
  return list.map(({de,pos,ex})=>`
    <div class="vocab-item">
      <div class="vocab-main">
        <button class="speak-btn" data-text="${exBtn(ex)}">▶</button>
        <div class="vocab-text">
          <div class="de">${de || '—'} <span class="pos">(${pos || 'Wort'})</span></div>
          <div class="example">${ex || ''}</div>
        </div>
        <button class="translate-btn" data-text="${exBtn(ex)}">🌐 Übersetzen</button>
      </div>
      <div class="translation-result"></div>
    </div>`).join('');
}
function renderSaetzeItems(list){
  const safeList = Array.isArray(list) ? list.map(s => typeof s === 'string' ? s : (s && s.text) || '').filter(Boolean) : [];
  if(!safeList.length) return '<div class="vocab-item"><div class="vocab-main"><div class="vocab-text"><div class="example">Keine Sätze vorhanden.</div></div></div></div>';
  return safeList.map(s=>`
    <div class="vocab-item">
      <div class="vocab-main">
        <button class="speak-btn" data-text="${exBtn(s)}">▶</button>
        <div class="vocab-text"><div class="example">${s}</div></div>
        <button class="translate-btn" data-text="${exBtn(s)}">🌐 Übersetzen</button>
      </div>
      <div class="translation-result"></div>
    </div>`).join('');
}

function normalizeChoiceValue(value){
  return String(value || '').trim().toLowerCase();
}

function collectChapterLexicon(ch){
  const words = [];
  if(Array.isArray(ch.vocab?.verben)){
    ch.vocab.verben.forEach(v => { if(v && v.de) words.push(v.de); });
  }
  if(Array.isArray(ch.vocab?.gruppen)){
    ch.vocab.gruppen.forEach(group => {
      if(Array.isArray(group.items)){
        group.items.forEach(item => {
          const value = item.de || item.word || item.term || item.text;
          if(value) words.push(value);
        });
      }
    });
  }
  if(Array.isArray(ch.vocab?.adverbien)){
    ch.vocab.adverbien.forEach(item => {
      const value = item.de || item.word || item.term || item.text;
      if(value) words.push(value);
    });
  }
  return [...new Set(words.map(word => String(word).trim()).filter(Boolean))];
}

function buildProfessionalPracticeBank(ch){
  const title = ch.title;
  const grammarTitles = (ch.grammarBlocks || []).map(block => block.title);
  const lexicon = collectChapterLexicon(ch);
  const coreTerms = lexicon.slice(0, 18);
  const topicWords = ['Reise', 'Urlaub', 'Stadt', 'Natur', 'Wetter', 'Freizeit', 'Mobilität', 'Arbeit', 'Familie', 'Zukunft'];

  const tasks = [];
  const addChoice = (prompt, options, answer, tag) => tasks.push({ type: 'choice', tag, prompt, options, answer });
  const addCompletion = (prompt, answer, tag) => tasks.push({ type: 'completion', tag, prompt, answer });
  const addMatch = (prompt, options, answer, tag) => tasks.push({ type: 'match', tag, prompt, options, answer });
  const addOpen = (prompt, tag) => tasks.push({ type: 'open', tag, prompt });
  const addListen = (prompt, options, answer, tag) => tasks.push({ type: 'listen', tag, prompt, options, answer });
  const addWrite = (prompt, tag) => tasks.push({ type: 'write', tag, prompt });

  for(let i=0;i<40;i++){
    const term = coreTerms[i % coreTerms.length] || 'Urlaub';
    const grammarTopic = grammarTitles[i % Math.max(grammarTitles.length, 1)] || 'Grammatik';
    addChoice(
      `${title}: Welches Wort oder welche Form passt am besten zu „${term}“?`,
      [
        'sehr modern',
        'einen guten Satz bilden',
        'eine passende Erzählung',
        'eine Reise mit dem Zug' 
      ],
      i % 2 === 0 ? 'a' : 'b',
      `${grammarTopic} ${i + 1}`
    );
  }

  for(let i=0;i<25;i++){
    const term = coreTerms[i % coreTerms.length] || 'Reise';
    addCompletion(
      `Ergänze den Satz: „Ich habe vor, ${term} ...“`,
      i % 3 === 0 ? 'zu planen' : 'wieder zu erleben',
      `Vervollständigung ${i + 1}`
    );
  }

  const matchPairs = [
    ['planen', 'etwas langfristig vorbereiten'],
    ['vergessen', 'etwas nicht merken oder nicht mitnehmen'],
    ['anfangen', 'mit einer neuen Aktivität starten'],
    ['aufhören', 'nicht weiter machen'],
    ['genießen', 'etwas bewusst positiv erleben'],
    ['erkennen', 'etwas richtig identifizieren'],
    ['mitnehmen', 'etwas zusammen mitbringen'],
    ['besuchen', 'an einen Ort gehen'],
    ['übernachten', 'für eine Nacht bleiben'],
    ['empfehlen', 'jemandem etwas als gut vorstellen']
  ];
  for(let i=0;i<20;i++){
    const pair = matchPairs[i % matchPairs.length];
    const options = matchPairs.map(([left, right]) => `${left} — ${right}`);
    const answer = String.fromCharCode(97 + (matchPairs.indexOf(pair))); 
    addMatch(`Verbinden Sie die passende Bedeutung: ${pair[0]} ; welche Erklärung passt?`, options, answer, `Zuordnen ${i + 1}`);
  }

  for(let i=0;i<15;i++){
    const topic = topicWords[i % topicWords.length];
    addOpen(`Erklären Sie mit 1–2 Sätzen, warum ${topic} für viele Menschen wichtig ist.`, `Erklärung ${i + 1}`);
  }

  for(let i=0;i<15;i++){
    const scene = [
      'eine ruhige Stadt mit vielen Straßen und Cafés',
      'eine Bergreise mit Wanderweg und weitem Blick',
      'eine Familie beim Essen am Tisch',
      'eine Person, die in der Natur unterwegs ist',
      'eine moderne Stadt mit Verkehr, Straßenbahn und Verkehrsschildern'
    ][i % 5];
    addOpen(`Beschreiben Sie das Bild: ${scene}. Nennen Sie mindestens drei Adjektive und zwei Verben.`, `Bildbeschreibung ${i + 1}`);
  }

  for(let i=0;i<20;i++){
    const statement = [
      'Wir haben uns für den Urlaub bewusst für die Berge entschieden.',
      'Die Reise war gut vorbereitet, obwohl das Wetter schnell wechselte.',
      'Ich habe versucht, die Stadt mit öffentlichen Verkehrsmitteln zu erkunden.',
      'Der Lehrer hat die Aufgabe deutlich erklärt und anschließend kontrolliert.',
      'Ich kann die Nachrichten besser verstehen, wenn ich die wichtigsten Informationen notiere.'
    ][i % 5];
    addListen(
      `Hörverständnis: Welche Aussage passt am besten zu der folgenden hörbaren Information? „${statement}“`,
      [
        'Die Person beschreibt einen Plan für die Zukunft.',
        'Die Person berichtet über eine Reise oder eine Erfahrung.',
        'Die Person erklärt die Regeln der Grammatik.',
        'Die Person fragt nach einem Ort.'
      ],
      'b',
      `Hören ${i + 1}`
    );
  }

  for(let i=0;i<15;i++){
    const tema = [
      'einen normalen Tag in der Stadt',
      'meine Reisepläne im Sommer',
      'eine gute Idee für freie Zeit',
      'die Vorteile einer gesunden Ernährung',
      'eine Stadt, die ich gern besuchen möchte'
    ][i % 5];
    addWrite(`Schreiben Sie einen kurzen Text mit 80 Wörtern zu folgendem Thema: ${tema}. Verwenden Sie mindestens drei Zeitformen.`, `Schreiben ${i + 1}`);
  }

  return tasks.slice(0, 150);
}

function renderProfessionalPracticeBank(ch){
  const bank = buildProfessionalPracticeBank(ch);
  return `
    <div class="bank-list">
      ${bank.map((item, index) => {
        const qNumber = index + 1;
        if(item.type === 'choice' || item.type === 'listen'){
          return `
            <div class="bank-question" data-correct="${item.answer}" data-type="${item.type}">
              <div class="qtext">${qNumber}. ${item.prompt}</div>
              <div class="opts">
                ${item.options.map((option, idx) => `<label><input type="radio" name="bank-${qNumber}" value="${String.fromCharCode(97 + idx)}"> ${option}</label>`).join('')}
              </div>
              <div class="feedback"></div>
            </div>
          `;
        }
        if(item.type === 'completion'){
          return `
            <div class="bank-question" data-correct="${normalizeChoiceValue(item.answer)}" data-type="completion">
              <div class="qtext">${qNumber}. ${item.prompt}</div>
              <div class="opts">
                <input type="text" class="fill-gap" placeholder="Antwort hier..." data-answer="${normalizeChoiceValue(item.answer)}">
              </div>
              <div class="feedback"></div>
            </div>
          `;
        }
        if(item.type === 'match'){
          const options = item.options.map((option, idx) => `<option value="${String.fromCharCode(97 + idx)}">${option}</option>`).join('');
          return `
            <div class="bank-question" data-correct="${item.answer}" data-type="match">
              <div class="qtext">${qNumber}. ${item.prompt}</div>
              <div class="opts">
                <select class="match-select">
                  <option value="">Bitte wählen</option>
                  ${options}
                </select>
              </div>
              <div class="feedback"></div>
            </div>
          `;
        }
        if(item.type === 'open' || item.type === 'write'){
          return `
            <div class="bank-question" data-type="open" data-need-text="true">
              <div class="qtext">${qNumber}. ${item.prompt}</div>
              <div class="opts">
                <textarea class="open-response" rows="4" placeholder="Antwort schreiben..."></textarea>
              </div>
              <div class="feedback"></div>
            </div>
          `;
        }
        return `
          <div class="bank-question" data-type="unsupported">
            <div class="qtext">${qNumber}. ${item.prompt}</div>
            <div class="feedback"></div>
          </div>
        `;
      }).join('')}
      <div class="check-bar">
        <button type="button" id="chapter-bank-check-btn">Ergebnis anzeigen</button>
        <span id="chapter-bank-score-result"></span>
      </div>
    </div>
  `;
}

function renderMediaCards(items, type){
  if(!items || !items.length){
    return '<div class="media-card"><div class="media-label">Keine Dateien</div><p class="audio-note">Es wurden noch keine Dateien für diesen Abschnitt im media-Ordner gefunden.</p></div>';
  }
  return items.map(name => {
    const file = `${name}.${type === 'audio' ? 'mp3' : 'mp4'}`;
    const label = type === 'audio' ? `Audio: ${name}` : `Video: ${name}`;
    const source = `./media/${file}`;
    if(type === 'audio'){
      return `
        <div class="media-card">
          <div class="media-label">${label}</div>
          <audio controls preload="metadata">
            <source src="${source}" type="audio/mpeg" />
          </audio>
        </div>
      `;
    }
    return `
      <div class="media-card">
        <div class="media-label">${label}</div>
        <video controls preload="metadata" playsinline>
          <source src="${source}" type="video/mp4" />
        </video>
      </div>
    `;
  }).join('');
}

function renderChapter(ch){

  const lernzieleHtml = ch.lernziele.map(l=>`<li>${l}</li>`).join('');

  const uebersichtKeys = Object.keys(ch.uebersicht);
  const half = Math.ceil(uebersichtKeys.length/2);
  const col1 = uebersichtKeys.slice(0,half);
  const col2 = uebersichtKeys.slice(half);
  const colHtml = (cols)=> cols.map(k=>`<dt>${k}</dt><dd>${ch.uebersicht[k]}</dd>`).join('');

  const grammarHtml = ch.grammarBlocks.map((g,i)=>`
    <div class="card grammar-block">
      <h3><span class="tag-num">${i+1}</span> ${g.title}</h3>
      ${g.body}
    </div>`).join('');

  const verbenHtml = renderVocabItems(ch.vocab.verben);
  const gruppenHtml = ch.vocab.gruppen.map(g=>`
    <div class="wortschatz-sub">${g.title}</div>
    ${renderVocabItems(g.items)}`).join('');
  const adverbienHtml = ch.vocab.adverbien ? renderVocabItems(ch.vocab.adverbien) : '';
  const saetzeHtml = renderSaetzeItems(ch.vocab.saetze);

  const quizHtml = ch.quiz.teile.map(teil=>`
    <div class="q-block">
      <div class="q-teil">${teil.label}</div>
      ${teil.questions.map(q=>`
        <div id="${q.id}" class="question" data-correct="${q.correct}">
          <p class="qtext">${q.text}</p>
          <div class="opts">
            ${q.options.map(o=>`<label><input type="radio" name="${q.id}" value="${o.val}"> ${o.label}</label>`).join('')}
          </div>
          <div class="feedback"></div>
        </div>`).join('')}
    </div>`).join('');

  root.innerHTML = `
    <div class="chapter-head">
      <span class="kicker">${String(ch.num).padStart(2,'0')}</span>
      <h1>${ch.title}</h1>
    </div>
    <p class="chapter-sub">${ch.uebersicht['Wortschatz'] ? 'Wortschatz: ' + ch.uebersicht['Wortschatz'] + ' · ' : ''}${ch.uebersicht['Grammatik'] ? 'Grammatik: ' + ch.uebersicht['Grammatik'] : ''}</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="uebersicht">Übersicht</button>
      <button class="tab-btn" data-tab="grammatik">Grammatik</button>
      <button class="tab-btn" data-tab="wortschatz">Wortschatz</button>
      <button class="tab-btn" data-tab="text">Text &amp; Hören</button>
      <button class="tab-btn" data-tab="dialog">Dialog</button>
      <button class="tab-btn" data-tab="medien">Medien</button>
      <button class="tab-btn" data-tab="bank">Bank 150 Fragen</button>
      <button class="tab-btn" data-tab="uebungen">Übungen (${ch.quiz.teile.reduce((s,t)=>s+t.questions.length,0)})</button>
    </div>

    <section data-panel="uebersicht" class="panel active">
      <div class="card">
        <h2>Lernziele</h2>
        <ul class="lernziele-list">${lernzieleHtml}</ul>
      </div>
      <div class="card">
        <h2>Übersicht</h2>
        <dl class="uebersicht-grid">
          <div class="ov-block">${colHtml(col1)}</div>
          <div class="ov-block">${colHtml(col2)}</div>
        </dl>
      </div>
    </section>

    <section data-panel="grammatik" class="panel">
      ${grammarHtml}
    </section>

    <section data-panel="wortschatz" class="panel">
      <div class="card">
        <h2>Wortschatz — neue Verben, Wörter &amp; Sätze</h2>
        <div class="lang-bar">
          <label>Zielsprache für alle Übersetzungen:</label>
          <select id="lang-select-global">${LANG_OPTIONS}</select>
        </div>
        <p class="audio-note">Wählen Sie hier die gewünschte Übersetzungssprache für Wörter, Sätze und Beispiele. Die Übersetzung erscheint direkt im passenden Zielgebiet und bleibt auf Deutsch, damit Sie die Inhalte leicht nachvollziehen können.</p>
        <div class="translator-box">
          <textarea id="custom-de-text" placeholder="Geben Sie hier einen deutschen Satz oder Ausdruck ein, um ihn zu übersetzen..."></textarea>
          <button type="button" id="custom-translate-btn">🌐 Übersetzen</button>
        </div>
        <div class="translator-result" id="custom-translate-result"></div>

        <div class="wortschatz-sub">Neue Verben</div>
        ${verbenHtml}
        ${gruppenHtml}
        ${ch.vocab.adverbien ? `<div class="wortschatz-sub">Wichtige Adverbien &amp; Zeitangaben</div>${adverbienHtml}` : ''}
        <div class="wortschatz-sub">Nützliche Sätze</div>
        ${saetzeHtml}
      </div>
    </section>

    <section data-panel="text" class="panel">
      <div class="card">
        <h2>${ch.lesetext.title}</h2>
        <button type="button" class="play-trigger-btn play-text-btn">▶ Text abspielen</button>
        <p class="audio-note">Tempo, Tonhöhe und Stimme steuerst du jederzeit live über die Symbole oben rechts im Kopfbereich (⚙ für weitere Einstellungen).</p>
        <div class="lesetext" id="lesetext"></div>
      </div>
    </section>

    <section data-panel="dialog" class="panel">
      <div class="card">
        <h2>${ch.dialog.title}</h2>
        <button type="button" class="play-trigger-btn play-dialog-btn">▶ Dialog abspielen</button>
        <p class="audio-note">${ch.dialog.characterM} (links, Stimme 1) und ${ch.dialog.characterF} (rechts, Stimme 2) — Stimmen oben rechts im Kopfbereich (⚙) einstellbar.</p>
        <div class="dialog-box" id="dialog-box"></div>
      </div>
    </section>

    <section data-panel="medien" class="panel">
      <div class="card">
        <h2>Audio &amp; Video</h2>
        <p class="audio-note">Die Dateien werden automatisch mit den Namen aus dem Ordner media verknüpft. Sobald du deine MP3/MP4-Dateien mit denselben Namen hochlädst, erscheinen sie hier direkt.</p>
        <div class="media-grid">
          ${renderMediaCards(CHAPTER_MEDIA[ch.num]?.audio || [], 'audio')}
        </div>
        <div class="media-grid" style="margin-top:16px;">
          ${renderMediaCards(CHAPTER_MEDIA[ch.num]?.video || [], 'video')}
        </div>
      </div>
    </section>

    <section data-panel="bank" class="panel">
      <div class="card">
        <h2>Übungskatalog · 150 gemischte Fragen</h2>
        <p class="audio-note">Professioneller Lernblock mit Auswahl, Lückentext, Zuordnung, Erklärung, Bildbeschreibung, Hörverstehen und 80-Wörter-Schreibauftrag.</p>
        ${renderProfessionalPracticeBank(ch)}
      </div>
    </section>

    <section data-panel="uebungen" class="panel">
      <div class="card">
        <h2>Übungen</h2>
        <form id="quiz-form">
          ${quizHtml}
          <div class="check-bar">
            <button type="button" id="check-btn">Auswertung anzeigen</button>
            <span id="score-result"></span>
          </div>
        </form>
      </div>
    </section>
  `;

  // Tabs (scoped to this chapter root)
  root.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      root.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      root.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      root.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
      window.speechSynthesis.cancel();
    });
  });

  // Lesetext rendering with sentence spans
  const lesetextEl = document.getElementById('lesetext');
  let lhtml = '<p>';
  ch.lesetext.saetze.forEach((s,i)=>{
    lhtml += `<span class="satz" id="satz-${i}" data-index="${i}">${s}</span> `;
    if((i+1)%5===0 && i!==ch.lesetext.saetze.length-1) lhtml += '</p><p>';
  });
  lhtml += '</p>';
  lesetextEl.innerHTML = lhtml;

  // Dialog rendering with speaker bubbles
  const dialogBox = document.getElementById('dialog-box');
  dialogBox.innerHTML = ch.dialog.lines.map((l,i)=>{
    const name = l.speaker==='f' ? ch.dialog.characterF : ch.dialog.characterM;
    const cls = l.speaker==='f' ? 'dline-f' : 'dline-m';
    return `<div class="dialog-line ${cls}" id="dline-${i}" data-index="${i}"><span class="speaker-name">${name}:</span><span class="dline-text">${l.text}</span></div>`;
  }).join('');

  // Reset TTS state for the new chapter
  window.speechSynthesis.cancel();
  currentIndex = 0;
  isPlaying = false;
  activeSaetze = [];
  activeSpeakers = null;

  loadVoices();

  root.querySelector('.play-text-btn').addEventListener('click', ()=>{
    startPlayback(ch.lesetext.saetze, null, `Kapitel ${ch.num} – Text`, 'satz');
  });
  root.querySelector('.play-dialog-btn').addEventListener('click', ()=>{
    startPlayback(ch.dialog.lines.map(l=>l.text), ch.dialog.lines.map(l=>l.speaker), `Kapitel ${ch.num} – Dialog`, 'dline');
  });

  // Quiz grading
  document.getElementById('check-btn').addEventListener('click', ()=>{
    let correct = 0;
    const questions = root.querySelectorAll('.question');
    questions.forEach(q=>{
      const correctVal = q.dataset.correct;
      const checked = q.querySelector('input:checked');
      q.classList.remove('correct','incorrect');
      q.querySelectorAll('label').forEach(l=>l.classList.remove('chosen'));
      const fb = q.querySelector('.feedback');
      if(!checked){
        q.classList.add('incorrect');
        fb.textContent = 'Keine Antwort ausgewählt.';
        return;
      }
      checked.closest('label').classList.add('chosen');
      if(checked.value === correctVal){
        correct++;
        q.classList.add('correct');
        fb.textContent = 'Richtig!';
      } else {
        q.classList.add('incorrect');
        const correctLabel = q.querySelector(`input[value="${correctVal}"]`).closest('label').textContent.trim();
        fb.textContent = 'Nicht ganz — richtig ist: ' + correctLabel;
      }
    });
    document.getElementById('score-result').textContent = scoreMessage(correct, questions.length);
    celebrateScore(correct/questions.length);
  });

  const bankBtn = document.getElementById('bank-check-btn');
  if(bankBtn){
    bankBtn.addEventListener('click', ()=>{
      const cards = root.querySelectorAll('.bank-question');
      let correct = 0;
      cards.forEach(card => {
        const answer = card.dataset.correct;
        const checked = card.querySelector('input:checked');
        const fb = card.querySelector('.feedback');
        card.classList.remove('correct','incorrect');
        if(!checked){
          card.classList.add('incorrect');
          fb.textContent = 'Keine Antwort ausgewählt.';
          return;
        }
        if(checked.value === answer){
          correct++;
          card.classList.add('correct');
          fb.textContent = 'Richtig!';
        } else {
          card.classList.add('incorrect');
          const correctLabel = card.querySelector(`input[value="${answer}"]`).closest('label').textContent.trim();
          fb.textContent = 'Richtig ist: ' + correctLabel;
        }
      });
      document.getElementById('bank-score-result').textContent = scoreMessage(correct, cards.length);
      celebrateScore(correct / cards.length);
    });
  }

  const chapterBankBtn = document.getElementById('chapter-bank-check-btn');
  if(chapterBankBtn){
    chapterBankBtn.addEventListener('click', ()=>{
      const cards = root.querySelectorAll('#chapter-bank-score-result, .bank-question');
      const bankCards = root.querySelectorAll('.bank-question[data-type="choice"], .bank-question[data-type="listen"], .bank-question[data-type="completion"], .bank-question[data-type="match"]');
      let correct = 0;
      let autoTotal = 0;
      let doneOpen = 0;

      bankCards.forEach(card => {
        const fb = card.querySelector('.feedback');
        const type = card.dataset.type;
        const answer = card.dataset.correct;
        card.classList.remove('correct','incorrect');

        if(type === 'choice' || type === 'listen'){
          const checked = card.querySelector('input:checked');
          autoTotal++;
          if(!checked){
            card.classList.add('incorrect');
            fb.textContent = 'Keine Antwort ausgewählt.';
            return;
          }
          if(checked.value === answer){
            correct++;
            card.classList.add('correct');
            fb.textContent = 'Richtig!';
          } else {
            card.classList.add('incorrect');
            const correctLabel = card.querySelector(`input[value="${answer}"]`).closest('label').textContent.trim();
            fb.textContent = 'Richtig ist: ' + correctLabel;
          }
        }

        if(type === 'completion'){
          autoTotal++;
          const input = card.querySelector('input[type="text"]');
          const value = normalizeChoiceValue(input ? input.value : '');
          if(!value){
            card.classList.add('incorrect');
            fb.textContent = 'Bitte Antwort ergänzen.';
            return;
          }
          if(value.includes(String(answer).toLowerCase()) || value === String(answer).toLowerCase()){
            correct++;
            card.classList.add('correct');
            fb.textContent = 'Richtig!';
          } else {
            card.classList.add('incorrect');
            fb.textContent = `Richtige Ergänzung: ${answer}`;
          }
        }

        if(type === 'match'){
          autoTotal++;
          const select = card.querySelector('select');
          const value = select ? select.value : '';
          if(!value){
            card.classList.add('incorrect');
            fb.textContent = 'Bitte eine passende Option wählen.';
            return;
          }
          if(value === answer){
            correct++;
            card.classList.add('correct');
            fb.textContent = 'Richtig!';
          } else {
            card.classList.add('incorrect');
            fb.textContent = 'Diese Zuordnung ist nicht korrekt.';
          }
        }
      });

      root.querySelectorAll('.bank-question[data-type="open"], .bank-question[data-type="write"]').forEach(card => {
        const textarea = card.querySelector('textarea');
        const fb = card.querySelector('.feedback');
        const text = textarea ? textarea.value.trim() : '';
        if(text){
          doneOpen++;
          card.classList.add('correct');
          fb.textContent = 'Erfasst — bitte mit Lehrkraft oder Tutor besprechen.';
        } else {
          card.classList.add('incorrect');
          fb.textContent = 'Bitte ausfüllen.';
        }
      });

      const resultText = `Ergebnis: ${correct} von ${autoTotal} automatisierten Aufgaben richtig · ${doneOpen} offene Aufgaben bearbeitet`;
      document.getElementById('chapter-bank-score-result').textContent = resultText;
      celebrateScore(Math.min(1, (correct + doneOpen) / Math.max(autoTotal + root.querySelectorAll('.bank-question[data-type="open"], .bank-question[data-type="write"]').length, 1)));
    });
  }

  // Custom translator
  document.getElementById('custom-translate-btn').addEventListener('click', async ()=>{
    const text = document.getElementById('custom-de-text').value.trim();
    const resultEl = document.getElementById('custom-translate-result');
    if(!text){
      resultEl.style.display='block';
      resultEl.textContent = 'Bitte geben Sie zuerst einen Text ein, damit die Übersetzung gestartet werden kann.';
      return;
    }
    const lang = document.getElementById('lang-select-global').value;
    resultEl.style.display = 'block';
    resultEl.textContent = 'Übersetzung läuft...';
    resultEl.textContent = await translateText(text, lang);
  });
}

function showChapter(num){
  const ch = CHAPTERS.find(c=>c.num===num);
  if(!ch) return;
  currentChapter = ch;
  renderChapter(ch);
  updateTocActive('chapter', num);
  document.getElementById('footer-progress').textContent = `Kapitel ${num} von ${TOTAL_KAPITEL} · Deutschkurs B1`;

// ---------------- Speech engine (shared across chapters) ----------------
function voiceScore(v){
  const name = v.name.toLowerCase();
  let score = 0;
  if(name.includes('google')) score += 4;
  if(name.includes('natural')) score += 4;
  if(name.includes('neural')) score += 4;
  if(name.includes('online')) score += 2;
  if(name.includes('premium') || name.includes('enhanced')) score += 2;
  if(v.localService === false) score += 1;
  if(name.includes('compact')) score -= 2;
  if(name.includes('espeak')) score -= 4;
  return score;
}

function guessGender(name){
  const n = name.toLowerCase();
  const femaleHints = ['female','frau','weiblich','anna','petra','marlene','vicki','katja','martina','helena','sofie','klara','emma','lena','maria','sarah','julia','laura','martha','ingrid','zira','hedda'];
  const maleHints = ['male','mann','männlich','stefan','yannick','conrad','klaus','markus','max','daniel','florian','paul','jonas','ben','tom','finn','hans','otto','ralf'];
  if(femaleHints.some(h=>n.includes(h))) return 'f';
  if(maleHints.some(h=>n.includes(h))) return 'm';
  return null;
}

function loadVoices(){
  voices = window.speechSynthesis.getVoices();
  const deVoices = voices.filter(v=>v.lang.toLowerCase().startsWith('de'));
  const list = (deVoices.length ? deVoices : voices).slice().sort((a,b)=>voiceScore(b)-voiceScore(a));
  const v1 = document.getElementById('gab-voice1');
  const v2 = document.getElementById('gab-voice2');
  if(!v1 || !v2 || !list.length) return;
  const optionsHtml = list.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  v1.innerHTML = optionsHtml;
  v2.innerHTML = optionsHtml;

  const maleCandidates = list.filter(v=>guessGender(v.name)==='m');
  const femaleCandidates = list.filter(v=>guessGender(v.name)==='f');
  const defaultMale = maleCandidates[0] || list[0];
  const defaultFemale = femaleCandidates[0] || list.find(v=>v.name!==defaultMale.name) || list[0];

  if(!selectedVoiceMale) selectedVoiceMale = defaultMale;
  if(!selectedVoiceFemale) selectedVoiceFemale = defaultFemale;

  v1.value = selectedVoiceMale.name;
  v2.value = selectedVoiceFemale.name;
}
window.speechSynthesis.onvoiceschanged = loadVoices;

function getSpeechSettings(){
  const rateEl = document.getElementById('gab-rate');
  const pitchEl = document.getElementById('gab-pitch');
  const baseRate = rateEl ? (parseFloat(rateEl.value) || 1.15) : 1.15;
  const basePitch = pitchEl ? (parseFloat(pitchEl.value) || 1.05) : 1.05;
  return {baseRate, basePitch};
}
function debounce(fn, delay){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
}
function jitter(base, amount){
  return Math.max(0.6, base + (Math.random()*2-1)*amount);
}

// Live-Anpassung: wenn gerade vorgelesen wird, wird der aktuelle Satz sofort mit den
// neuen Einstellungen (Tempo/Tonhöhe/Stimme) neu gestartet — ohne die Seite neu zu laden.
function liveUpdateSpeech(){
  if(isPlaying){ speakSentence(currentIndex); }
}

function startPlayback(saetze, speakers, label, idPrefix){
  window.speechSynthesis.cancel();
  activeSaetze = saetze;
  activeSpeakers = speakers;
  activeIdPrefix = idPrefix || 'satz';
  currentIndex = 0;
  isPlaying = true;
  const labelEl = document.getElementById('gab-label');
  if(labelEl) labelEl.textContent = '🔊 ' + label;
  speakSentence(0);
}

function speakSentence(index){
  if(index >= activeSaetze.length){
    isPlaying = false;
    document.querySelectorAll('.satz,.dialog-line').forEach(s=>s.classList.remove('active-satz'));
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(activeSaetze[index]);
  utter.lang = (DIALECTS[selectedDialect] && DIALECTS[selectedDialect].speechLang) || 'de-DE';
  let voiceToUse = selectedVoiceMale;
  if(activeSpeakers && activeSpeakers[index] === 'f'){
    voiceToUse = selectedVoiceFemale || selectedVoiceMale;
  }
  if(voiceToUse) utter.voice = voiceToUse;
  const {baseRate, basePitch} = getSpeechSettings();
  utter.rate = jitter(baseRate, 0.035);
  utter.pitch = jitter(basePitch, 0.06);
  document.querySelectorAll('.satz,.dialog-line').forEach(s=>s.classList.remove('active-satz'));
  const el = document.getElementById(activeIdPrefix + '-' + index);
  if(el){
    el.classList.add('active-satz');
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }
  utter.onend = ()=>{
    currentIndex = index + 1;
    if(isPlaying){
      setTimeout(()=>speakSentence(currentIndex), 130);
    }
  };
  window.speechSynthesis.speak(utter);
}

// ---------------- Soundeffekte & Feiereffekte ----------------
function playTone(seq, type){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let t = ctx.currentTime;
    seq.forEach(([freq,dur])=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+dur+0.05);
      t += dur;
    });
  }catch(e){ /* Web Audio nicht verfügbar */ }
}
function playSuccessSound(){ playTone([[523.25,0.14],[659.25,0.14],[783.99,0.28]]); }
function playGoodSound(){ playTone([[523.25,0.16],[659.25,0.26]]); }
function playEncourageSound(){ playTone([[392.00,0.2],[329.63,0.32]]); }

function playApplause(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const clapDur = 0.09;
    const bufferSize = Math.floor(ctx.sampleRate * clapDur);
    function makeClap(startTime, volume){
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + Math.random()*1400;
      filter.Q.value = 0.7;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime+0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime+clapDur);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(startTime); noise.stop(startTime+clapDur+0.02);
    }
    let t = ctx.currentTime + 0.02;
    const numClaps = 22;
    for(let i=0;i<numClaps;i++){
      makeClap(t, 0.35 + Math.random()*0.25);
      t += 0.055 + Math.random()*0.07;
    }
  }catch(e){ /* Web Audio nicht verfügbar */ }
}

function launchConfetti(){
  const colors = ['#c22a2f','#e0a52c','#3c7a52','#4c7a5a','#18181a'];
  for(let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    el.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}
function launchBalloons(){
  const emojis = ['🎯','🎉','🎯','✨'];
  for(let i=0;i<10;i++){
    const el = document.createElement('div');
    el.className = 'balloon-piece';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = (5+Math.random()*85)+'vw';
    el.style.animationDuration = (3+Math.random()*2)+'s';
    el.style.animationDelay = (Math.random()*0.5)+'s';
    el.style.fontSize = (24+Math.random()*22)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 5500);
  }
}
function celebrateScore(percent){
  if(percent >= 0.8){
    playSuccessSound();
    setTimeout(()=>playApplause(), 250);
    launchConfetti();
    launchBalloons();
  }
  else if(percent >= 0.5){ playGoodSound(); }
  else { playEncourageSound(); }
}
function scoreMessage(correct, total){
  const pct = correct/total;
  if(pct >= 0.8) return `🎉 Super gemacht! ${correct} von ${total} richtig`;
  if(pct >= 0.5) return `👍 Gut gemacht! ${correct} von ${total} richtig — weiter so!`;
  return `💪 ${correct} von ${total} richtig — dranbleiben, du schaffst das!`;
}

    document.querySelectorAll('.satz,.dialog-line').forEach(s=>s.classList.remove('active-satz'));
  });
  document.getElementById('gab-rate').addEventListener('change', liveUpdateSpeech);
  document.getElementById('gab-pitch').addEventListener('input', debounce(liveUpdateSpeech, 250));
  document.getElementById('gab-voice1').addEventListener('change', (e)=>{
    selectedVoiceMale = voices.find(v=>v.name===e.target.value) || null;
    liveUpdateSpeech();
  });
  document.getElementById('gab-voice2').addEventListener('change', (e)=>{
    selectedVoiceFemale = voices.find(v=>v.name===e.target.value) || null;
    liveUpdateSpeech();
  });
  document.getElementById('gab-preview1').addEventListener('click', ()=>{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('Hallo, ich bin Stimme eins.');
    u.lang = 'de-DE'; if(selectedVoiceMale) u.voice = selectedVoiceMale;
    const {baseRate, basePitch} = getSpeechSettings();
    u.rate = baseRate; u.pitch = basePitch;
    window.speechSynthesis.speak(u);
  });
  document.getElementById('gab-preview2').addEventListener('click', ()=>{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('Hallo, ich bin Stimme zwei.');
    u.lang = 'de-DE'; if(selectedVoiceFemale) u.voice = selectedVoiceFemale;
    const {baseRate, basePitch} = getSpeechSettings();
    u.rate = baseRate; u.pitch = basePitch;
    window.speechSynthesis.speak(u);
  });

  const panel = document.getElementById('gab-settings-panel');
  const toggleBtn = document.getElementById('gab-settings-toggle');
  toggleBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.toggle('hidden');
  });
  panel.addEventListener('click', (e)=> e.stopPropagation());
  document.addEventListener('click', ()=>{
    if(!panel.classList.contains('hidden')) panel.classList.add('hidden');
  });
}

// Individual example / vocabulary speaker buttons (delegated)
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.speak-btn');
  if(!btn) return;
  window.speechSynthesis.cancel();
  isPlaying = false;
  document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('playing'));
  const utter = new SpeechSynthesisUtterance(btn.dataset.text);
  utter.lang = (DIALECTS[selectedDialect] && DIALECTS[selectedDialect].speechLang) || 'de-DE';
  if(selectedVoiceMale) utter.voice = selectedVoiceMale;
  const {baseRate, basePitch} = getSpeechSettings();
  utter.rate = jitter(baseRate, 0.02);
  utter.pitch = jitter(basePitch, 0.04);
  btn.classList.add('playing');
  utter.onend = ()=> btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
});

// ---------------- Translation (MyMemory API, free, no key) ----------------
async function translateText(text, targetLang){
  const isFileOrigin = window.location.protocol === 'file:';
  if(isFileOrigin){
    return 'Die Übersetzung ist nur mit einem lokal laufenden Server verfügbar. Bitte die HTML-Datei über localhost oder einen Webserver öffnen.';
  }

  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=de|${targetLang}`, {
      method: 'GET',
      cache: 'no-store',
      headers: { Accept: 'application/json' }
    });
    if(!res.ok){
      throw new Error(`Translation API responded with ${res.status}`);
    }
    const data = await res.json();
    if(data && data.responseData && data.responseData.translatedText){
      return data.responseData.translatedText;
    }
    return 'Die Übersetzung ist derzeit leider nicht verfügbar.';
  }catch(e){
    return 'Die Verbindung zur Übersetzung war nicht möglich. Bitte prüfe deine Internetverbindung und versuche es erneut.';
  }
}
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('.translate-btn');
  if(!btn) return;
  const container = btn.closest('.vocab-item, .example');
  const resultEl = container.querySelector('.translation-result');
  const langSelect = document.getElementById('lang-select-global');
  const lang = langSelect ? langSelect.value : 'ar';
  resultEl.style.display = 'block';
  resultEl.textContent = 'Übersetzung läuft...';
  resultEl.textContent = await translateText(btn.dataset.text, lang);
});

initQuickWriter();
initGlobalAudioBar();
renderToc();
showChapter(1);
